<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Workbench</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text-main: #0f172a;
      --text-muted: #6b7280;
      --accent: #0f172a;
      --sp4: #22c55e;
      --sp3: #3b82f6;
      --dummy1: #f59e0b;
      --dummy2: #94a3b8;
      --split-red: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px;
      min-height: 100vh;
    }

    .flex { display: flex; }
    .flex-row { flex-direction: row; }
    .flex-col { flex-direction: column; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-center { align-items: center; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }

    .text-xs { font-size: 11px; }
    .text-sm { font-size: 13px; }
    .font-semibold { font-weight: 600; }
    .font-medium { font-weight: 500; }
    .text-muted { color: var(--text-muted); }

    .btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-ghost { background: transparent; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-full { flex: 1; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }
    .card-soft {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    header { margin-bottom: 8px; }
    header .subtitle {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
      color: #9ca3af;
    }
    header .title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .chip-step {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
      font-size: 11px;
      margin-bottom: 8px;
    }
    .chip-step .circle {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #4b5563;
    }

    /* Kanal toggle (вместо SP4/SP3) */

    .kanal-toggle {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      background: #f9fafb;
      overflow-x: auto;
    }
    .kanal-toggle-btn {
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .kanal-toggle-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* Plan table */

    .plan { overflow: hidden; }

    .plan-header {
      display: grid;
      background: #e5e7eb;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      grid-template-columns: 40px repeat(4, minmax(0, 1fr));
    }
    .plan-header-cell {
      padding: 6px 4px;
      text-align: center;
      border-left: 1px solid var(--border);
      font-weight: 600;
    }
    .plan-header-cell:first-child { border-left: none; }
    .plan-header-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      border-radius: 999px;
      border-width: 1px;
      border-style: solid;
      font-size: 10px;
    }
    .sp4-label { border-color: var(--sp4); color: var(--sp4); }
    .sp3-label { border-color: var(--sp3); color: var(--sp3); }
    .dummy1-label { border-color: var(--dummy1); color: var(--dummy1); }
    .dummy2-label { border-color: var(--dummy2); color: var(--dummy2); }

    .plan-body-row {
      display: grid;
      grid-template-columns: 40px repeat(4, minmax(0, 1fr));
      border-top: 1px solid #f3f4f6;
      font-size: 11px;
      background: #fff;
    }
    .plan-row-index {
      padding: 10px 4px;
      text-align: center;
      color: #9ca3af;
    }
    .plan-cell {
      padding: 6px 4px;
      border-left: 1px solid #f3f4f6;
      position: relative;
    }
    .plan-cell-inner {
      height: 40px;
      border-radius: 8px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px dashed #e5e7eb;
      background: #f9fafb;
      cursor: pointer;
      overflow: hidden;
    }
    .plan-cell-inner.filled {
      border-style: solid;
      border-color: #d1d5db;
      background: #f9fafb;
    }
    .plan-cell-inner.drop-active {
      border-width: 2px;
      border-style: dashed;
      border-color: #0ea5e9;
      background: #e0f2fe;
    }
    .plan-cell-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .plan-cell-meta {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-left: 4px;
    }
    .plan-cell-category {
      font-size: 9px;
      text-transform: uppercase;
      color: #9ca3af;
    }
    .plan-cell-badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .plan-cell-badge.sp4 { border-color: var(--sp4); color: var(--sp4); }
    .plan-cell-badge.sp3 { border-color: var(--sp3); color: var(--sp3); }
    .plan-cell-clear {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 10px;
      color: #9ca3af;
      background: #f3f4f6;
      border-radius: 999px;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e5e7eb;
      cursor: pointer;
    }

    /* Library */

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab {
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: #f3f4f6;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      color: #4b5563;
    }
    .tab.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
    }
    .search-input-wrapper {
      position: relative;
      flex: 1;
    }
    .search-input {
      width: 100%;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 22px 6px 10px;
      font-size: 11px;
    }
    .search-icon {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: #9ca3af;
    }

    .library-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-top: 4px;
    }
    .lib-card {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f9fafb;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: grab;
    }
    .lib-card:active { cursor: grabbing; }
    .lib-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 4px;
    }
    .lib-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #4b5563;
    }
    .lib-pin {
      font-size: 12px;
      color: #d1d5db;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .lib-name {
      font-size: 11px;
      font-weight: 500;
      color: #111827;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lib-cat {
      font-size: 9px;
      text-transform: uppercase;
      color: #9ca3af;
    }
    .empty-text {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      padding: 16px 0;
    }

    /* Program table (1000 / 2000 MPF) */

    .program-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .program-grid-header-row,
    .program-grid-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }

    .program-grid-header-row {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: #f9fafb;
    }

    .program-grid-row {
      border-bottom: 1px solid #e5e7eb;
      min-height: 32px;
    }

    .program-grid-cell {
      border-right: 1px solid var(--border);
      padding: 4px;
      font-size: 10px;
      position: relative;
      overflow: hidden;
    }
    .program-grid-cell:last-child {
      border-right: none;
    }

    .program-grid-cell-header {
      text-align: center;
      font-weight: 600;
      font-size: 11px;
    }

    .program-split {
      border-left: 2px solid var(--split-red);
    }

    .program-cell-main {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .program-cell-sub {
      margin-top: 2px;
      font-size: 9px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.3);
      padding: 12px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .modal-title-main {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .modal-title-sub {
      font-size: 11px;
      color: #9ca3af;
    }
    .modal-close {
      font-size: 12px;
      color: #6b7280;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .modal-body {
      overflow-y: auto;
      padding-right: 4px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    .field-label {
      font-size: 10px;
      color: #6b7280;
    }
    .field-input,
    .field-select,
    .field-textarea {
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 6px 8px;
      font-size: 11px;
      font-family: inherit;
    }
    .field-textarea {
      min-height: 60px;
      resize: vertical;
    }

    .spindle-radio-group {
      display: inline-flex;
      gap: 6px;
    }
    .spindle-radio-btn {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f9fafb;
      cursor: pointer;
    }
    .spindle-radio-btn.active-sp4 {
      border-color: var(--sp4);
      color: var(--sp4);
      background: #ecfdf3;
    }
    .spindle-radio-btn.active-sp3 {
      border-color: var(--sp3);
      color: var(--sp3);
      background: #eff6ff;
    }

    @media (min-width: 640px) {
      .app { padding-top: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="flex flex-row justify-between items-center">
      <div>
        <div class="subtitle">Workpiece</div>
        <div class="title">WORKPIECE_1A</div>
      </div>
      <div class="flex flex-row gap-1">
        <button class="btn btn-ghost">Generate NC Code</button>
        <button class="btn btn-ghost">Import from NC</button>
      </div>
    </header>

    <div class="flex justify-center">
      <div class="chip-step">
        <div class="circle">2</div>
        <span>Build your plan</span>
      </div>
    </div>

    <!-- PLAN -->
    <section class="card plan" style="margin-bottom: 10px;">
      <!-- переключатель каналов -->
      <div class="kanal-toggle" id="kanal-toggle"></div>

      <!-- заголовок с Dummy/SP4/SP3/Dummy2 -->
      <div class="plan-header">
        <div class="plan-header-cell" style="color:#9ca3af;">#</div>
        <div class="plan-header-cell">
          <span class="plan-header-label dummy1-label">Dummy 1</span>
        </div>
        <div class="plan-header-cell">
          <span class="plan-header-label sp4-label">Spindel 4</span>
        </div>
        <div class="plan-header-cell">
          <span class="plan-header-label sp3-label">Spindel 3</span>
        </div>
        <div class="plan-header-cell">
          <span class="plan-header-label dummy2-label">Dummy 2</span>
        </div>
      </div>
      <div id="plan-body"></div>
    </section>

    <!-- LIBRARY -->
    <section class="card-soft" style="padding:10px; margin-bottom:10px;">
      <div class="section-header">
        <span class="text-xs font-semibold">Operation Library</span>
        <button class="btn btn-ghost text-xs">Manage templates</button>
      </div>

      <div class="tabs" id="category-tabs"></div>

      <div class="search-row">
        <div class="search-input-wrapper">
          <input
            id="search-input"
            type="text"
            class="search-input"
            placeholder="Search operation…" />
          <span class="search-icon">🔍</span>
        </div>
        <button class="btn btn-ghost text-xs">Filter</button>
      </div>

      <div class="library-grid" id="library-grid"></div>
    </section>

    <!-- PROGRAM TABLE 1000 / 2000 MPF -->
    <section class="card-soft" style="padding:10px;">
      <div class="program-header">
        <span>Schlitten 1 / Kanal 1 — 1000.MPF</span>
        <span>Schlitten 2 / Kanal 2 — 2000.MPF</span>
      </div>
      <div id="program-grid-header"></div>
      <div id="program-grid-body"></div>
    </section>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal-backdrop" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title-sub">Operation Properties</div>
          <div class="modal-title-main" id="modal-title-main">Row 1, SP4</div>
        </div>
        <button class="modal-close" id="modal-close-btn">Close</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label">Name *</label>
          <input id="field-name" class="field-input" placeholder="Probing outer diameter" />
        </div>
        <div class="field">
          <label class="field-label">Category</label>
          <select id="field-category" class="field-select">
            <option value="AUSSEN">Außen Bearbeitung</option>
            <option value="INNEN">Innen Bearbeitung</option>
            <option value="RADIAL">Radial Bearbeitung</option>
            <option value="AXIAL">Axial</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Kanal / Programm</label>
          <select id="field-kanal" class="field-select">
            <option value="1">Schlitten 1 / Kanal 1 — 1000.MPF</option>
            <option value="2">Schlitten 2 / Kanal 2 — 2000.MPF</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Spindel Badge</label>
          <div class="spindle-radio-group">
            <button type="button" id="spindle-badge-sp4" class="spindle-radio-btn">SP4</button>
            <button type="button" id="spindle-badge-sp3" class="spindle-radio-btn">SP3</button>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Remark</label>
          <textarea id="field-remark" class="field-textarea"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-full" id="modal-cancel-btn">Cancel</button>
        <button class="btn btn-primary btn-full" id="modal-save-btn">Save & attach to plan</button>
      </div>
    </div>
  </div>

  <script>
    // ---------- DATA ----------
    const categories = [
      { id: "AUSSEN", label: "Außen Bearbeitung" },
      { id: "INNEN", label: "Innen Bearbeitung" },
      { id: "RADIAL", label: "Radial Bearbeitung" },
      { id: "AXIAL", label: "Axial" }
    ];

    const allSpindles = [
      { id: "DUMMY1", label: "Dummy 1" },
      { id: "SP4", label: "Spindel 4" },
      { id: "SP3", label: "Spindel 3" },
      { id: "DUMMY2", label: "Dummy 2" },
    ];

    const rows = [1, 2, 3, 4, 5, 6];

    let operations = [
      { id: "op1", name: "Longitudinal Turning", category: "AUSSEN", description: "" },
      { id: "op2", name: "Probing outer diameter", category: "AUSSEN", description: "" },
      { id: "op3", name: "Probing inner diameter", category: "INNEN", description: "" },
      { id: "op4", name: "Radial groove pecking", category: "RADIAL", description: "" },
      { id: "op5", name: "Face groove pecking", category: "RADIAL", description: "" },
      { id: "op6", name: "Axial drilling", category: "AXIAL", description: "" },
    ];

    // plan[row][spindleId] = { operationId, kanal, spindleBadge } | null
    const plan = {};
    rows.forEach(row => {
      plan[row] = {};
      allSpindles.forEach(sp => {
        plan[row][sp.id] = null;
      });
    });

    let activeCategory = "AUSSEN";
    let searchTerm = "";
    let dragData = null; // { type: "LIB_OP" | "PLAN_OP", operationId?, row?, spindleId? }

    // какой канал сейчас редактируем 1 / 2
    let activeKanalView = 1;

    // state модалки
    let editingSlot = null; // { row, spindleId }
    let editorSpindleBadge = "SP4";

    // Program table config (бумажная таблица)
    const programColumns = [
      { kanal: 1, spindleId: "DUMMY1", label: "Dummy 1" },
      { kanal: 1, spindleId: "SP4", label: "Spindel 4" },
      { kanal: 1, spindleId: "SP3", label: "Spindel 3" },
      { kanal: 2, spindleId: "SP4", label: "Spindel 4" },
      { kanal: 2, spindleId: "SP3", label: "Spindel 3" },
      { kanal: 2, spindleId: "DUMMY2", label: "Dummy 2" },
    ];

    // ---------- DOM ----------
    const kanalToggleEl = document.getElementById("kanal-toggle");
    const planBodyEl = document.getElementById("plan-body");
    const libraryGridEl = document.getElementById("library-grid");
    const categoryTabsEl = document.getElementById("category-tabs");
    const searchInputEl = document.getElementById("search-input");

    const programGridHeaderEl = document.getElementById("program-grid-header");
    const programGridBodyEl = document.getElementById("program-grid-body");

    const modalBackdropEl = document.getElementById("modal-backdrop");
    const modalTitleMainEl = document.getElementById("modal-title-main");
    const fieldNameEl = document.getElementById("field-name");
    const fieldCategoryEl = document.getElementById("field-category");
    const fieldKanalEl = document.getElementById("field-kanal");
    const fieldRemarkEl = document.getElementById("field-remark");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const modalCancelBtn = document.getElementById("modal-cancel-btn");
    const modalSaveBtn = document.getElementById("modal-save-btn");
    const spindleBadgeSp4Btn = document.getElementById("spindle-badge-sp4");
    const spindleBadgeSp3Btn = document.getElementById("spindle-badge-sp3");

    // ---------- KANAL TOGGLE ----------

    function renderKanalToggle() {
      kanalToggleEl.innerHTML = "";

      const btn1 = document.createElement("button");
      btn1.className = "kanal-toggle-btn" + (activeKanalView === 1 ? " active" : "");
      btn1.textContent = "Schlitten 1 / Kanal 1 — 1000.MPF";
      btn1.addEventListener("click", () => {
        activeKanalView = 1;
        renderKanalToggle();
        renderPlan();
      });
      kanalToggleEl.appendChild(btn1);

      const btn2 = document.createElement("button");
      btn2.className = "kanal-toggle-btn" + (activeKanalView === 2 ? " active" : "");
      btn2.textContent = "Schlitten 2 / Kanal 2 — 2000.MPF";
      btn2.addEventListener("click", () => {
        activeKanalView = 2;
        renderKanalToggle();
        renderPlan();
      });
      kanalToggleEl.appendChild(btn2);
    }

    // ---------- PROGRAM TABLE ----------

    function renderProgramTable() {
      // header row
      programGridHeaderEl.innerHTML = "";
      const headerRow = document.createElement("div");
      headerRow.className = "program-grid-header-row";

      programColumns.forEach((col, idx) => {
        const cell = document.createElement("div");
        cell.className = "program-grid-cell program-grid-cell-header";
        if (idx === 3) cell.classList.add("program-split");
        cell.textContent = col.label;
        headerRow.appendChild(cell);
      });

      programGridHeaderEl.appendChild(headerRow);

      // body
      programGridBodyEl.innerHTML = "";
      rows.forEach(row => {
        const rowEl = document.createElement("div");
        rowEl.className = "program-grid-row";

        programColumns.forEach((col, idx) => {
          const cell = document.createElement("div");
          cell.className = "program-grid-cell";
          if (idx === 3) cell.classList.add("program-split");

          const assign = plan[row][col.spindleId];
          let mainText = "";
          let subText = "";

          if (assign && assign.kanal === col.kanal) {
            const op = operations.find(o => o.id === assign.operationId);
            if (op) {
              mainText = op.name;
              subText = op.description || "";
            }
          }

          const mainDiv = document.createElement("div");
          mainDiv.className = "program-cell-main";
          mainDiv.textContent = mainText;
          cell.appendChild(mainDiv);

          if (subText) {
            const subDiv = document.createElement("div");
            subDiv.className = "program-cell-sub";
            subDiv.textContent = subText;
            cell.appendChild(subDiv);
          }

          rowEl.appendChild(cell);
        });

        programGridBodyEl.appendChild(rowEl);
      });
    }

    // ---------- PLAN ----------

    function renderPlan() {
      planBodyEl.innerHTML = "";

      rows.forEach(row => {
        const rowEl = document.createElement("div");
        rowEl.className = "plan-body-row";

        const indexEl = document.createElement("div");
        indexEl.className = "plan-row-index";
        indexEl.textContent = row;
        rowEl.appendChild(indexEl);

        allSpindles.forEach(sp => {
          const cellEl = document.createElement("div");
          cellEl.className = "plan-cell";
          cellEl.dataset.row = row;
          cellEl.dataset.spindleId = sp.id;

          const inner = document.createElement("div");
          inner.className = "plan-cell-inner";

          const assign = plan[row][sp.id];
          const opId = assign && assign.kanal === activeKanalView ? assign.operationId : null;
          const op = opId ? operations.find(o => o.id === opId) : null;

          if (op) {
            inner.classList.add("filled");
            inner.draggable = true;
            inner.addEventListener("dragstart", () => {
              dragData = { type: "PLAN_OP", row, spindleId: sp.id };
            });
            inner.addEventListener("dragend", () => {
              dragData = null;
              clearDropHighlights();
            });
          }

          const textSpan = document.createElement("span");
          textSpan.className = "plan-cell-text";
          textSpan.textContent = op ? op.name : "Drop / Tap to edit";
          inner.appendChild(textSpan);

          if (op) {
            const meta = document.createElement("div");
            meta.className = "plan-cell-meta";

            const catSpan = document.createElement("span");
            catSpan.className = "plan-cell-category";
            catSpan.textContent = op.category;
            meta.appendChild(catSpan);

            // бейдж SP4/SP3 (виден только для реальных SP4/SP3)
            if (sp.id === "SP4" || sp.id === "SP3") {
              const badge = document.createElement("span");
              badge.className =
                "plan-cell-badge " + (sp.id === "SP4" ? "sp4" : "sp3");
              badge.textContent = sp.id;
              meta.appendChild(badge);
            }

            inner.appendChild(meta);

            const clearBtn = document.createElement("div");
            clearBtn.className = "plan-cell-clear";
            clearBtn.textContent = "×";
            clearBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              if (assign && assign.kanal === activeKanalView) {
                plan[row][sp.id] = null;
                renderPlan();
              }
            });
            cellEl.appendChild(clearBtn);
          }

          inner.addEventListener("click", () => {
            openEditor(row, sp.id);
          });

          cellEl.addEventListener("dragover", (e) => {
            e.preventDefault();
            if (!dragData) return;
            inner.classList.add("drop-active");
          });
          cellEl.addEventListener("dragleave", () => {
            inner.classList.remove("drop-active");
          });
          cellEl.addEventListener("drop", (e) => {
            e.preventDefault();
            inner.classList.remove("drop-active");
            handleDropOnSlot(row, sp.id);
          });

          cellEl.appendChild(inner);
          rowEl.appendChild(cellEl);
        });

        planBodyEl.appendChild(rowEl);
      });

      renderProgramTable();
    }

    function clearDropHighlights() {
      const inners = document.querySelectorAll(".plan-cell-inner");
      inners.forEach(i => i.classList.remove("drop-active"));
    }

    // ---------- DROP LOGIC ----------

    function handleDropOnSlot(row, spindleId) {
      if (!dragData) return;

      if (dragData.type === "LIB_OP") {
        plan[row][spindleId] = {
          operationId: dragData.operationId,
          kanal: getDefaultKanalForSpindle(spindleId),
          spindleBadge: spindleId === "SP3" ? "SP3" : "SP4",
        };
      }

      if (dragData.type === "PLAN_OP") {
        const fromRow = dragData.row;
        const fromSpindle = dragData.spindleId;
        const fromAssign = plan[fromRow][fromSpindle];
        const toAssign = plan[row][spindleId];

        plan[fromRow][fromSpindle] = toAssign || null;
        plan[row][spindleId] = fromAssign || null;
      }

      dragData = null;
      renderPlan();
    }

    function getDefaultKanalForSpindle(spindleId) {
      if (spindleId === "DUMMY1") return 1;
      if (spindleId === "DUMMY2") return 2;
      return activeKanalView; // SP4 / SP3 по текущему каналу
    }

    // ---------- LIBRARY ----------

    function renderCategoryTabs() {
      categoryTabsEl.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "tab" + (cat.id === activeCategory ? " active" : "");
        btn.textContent = cat.label;
        btn.addEventListener("click", () => {
          activeCategory = cat.id;
          renderCategoryTabs();
          renderLibrary();
        });
        categoryTabsEl.appendChild(btn);
      });
    }

    function renderLibrary() {
      libraryGridEl.innerHTML = "";

      const filtered = operations.filter(op => {
        if (op.category !== activeCategory) return false;
        if (!searchTerm) return true;
        return op.name.toLowerCase().includes(searchTerm.toLowerCase());
      });

      if (filtered.length === 0) {
        const emptyEl = document.createElement("div");
        emptyEl.className = "empty-text";
        emptyEl.textContent = "Keine Operationen in dieser Kategorie. Erstelle über Plan oben.";
        libraryGridEl.appendChild(emptyEl);
        return;
      }

      filtered.forEach(op => {
        const card = document.createElement("div");
        card.className = "lib-card";
        card.draggable = true;

        card.addEventListener("dragstart", () => {
          dragData = { type: "LIB_OP", operationId: op.id };
        });
        card.addEventListener("dragend", () => {
          dragData = null;
          clearDropHighlights();
        });

        const top = document.createElement("div");
        top.className = "lib-card-top";

        const icon = document.createElement("div");
        icon.className = "lib-icon";
        icon.textContent = "OP";

        const pinBtn = document.createElement("button");
        pinBtn.className = "lib-pin";
        pinBtn.textContent = "★";

        top.appendChild(icon);
        top.appendChild(pinBtn);

        const nameEl = document.createElement("div");
        nameEl.className = "lib-name";
        nameEl.textContent = op.name;

        const catEl = document.createElement("div");
        catEl.className = "lib-cat";
        catEl.textContent = op.category;

        card.appendChild(top);
        card.appendChild(nameEl);
        card.appendChild(catEl);

        libraryGridEl.appendChild(card);
      });
    }

    // ---------- MODAL / EDITOR ----------

    function setSpindleBadgeButtons(badge) {
      editorSpindleBadge = badge;
      spindleBadgeSp4Btn.className = "spindle-radio-btn" +
        (badge === "SP4" ? " active-sp4" : "");
      spindleBadgeSp3Btn.className = "spindle-radio-btn" +
        (badge === "SP3" ? " active-sp3" : "");
    }

    spindleBadgeSp4Btn.addEventListener("click", () => setSpindleBadgeButtons("SP4"));
    spindleBadgeSp3Btn.addEventListener("click", () => setSpindleBadgeButtons("SP3"));

    function openEditor(row, spindleId) {
      editingSlot = { row, spindleId };

      const assign = plan[row][spindleId];
      const opId = assign ? assign.operationId : null;
      const op = opId ? operations.find(o => o.id === opId) : null;

      modalTitleMainEl.textContent = "Row " + row + ", " + spindleId;
      fieldNameEl.value = op ? op.name : "";
      fieldCategoryEl.value = op ? op.category : (activeCategory || "AUSSEN");
      fieldRemarkEl.value = op ? (op.description || "") : "";

      let kanal = assign ? assign.kanal : getDefaultKanalForSpindle(spindleId);
      fieldKanalEl.value = String(kanal);

      // Dummy шпиндели фиксированы
      if (spindleId === "DUMMY1" || spindleId === "DUMMY2") {
        fieldKanalEl.disabled = true;
        fieldKanalEl.value = String(getDefaultKanalForSpindle(spindleId));
      } else {
        fieldKanalEl.disabled = false;
      }

      // бейдж SP4/SP3
      if (spindleId === "SP4" || spindleId === "SP3") {
        const badge = assign && assign.spindleBadge
          ? assign.spindleBadge
          : spindleId;
        setSpindleBadgeButtons(badge);
        spindleBadgeSp4Btn.disabled = false;
        spindleBadgeSp3Btn.disabled = false;
      } else {
        // для Dummy бейджи неактивны
        setSpindleBadgeButtons("SP4");
        spindleBadgeSp4Btn.disabled = true;
        spindleBadgeSp3Btn.disabled = true;
      }

      modalBackdropEl.style.display = "flex";
    }

    function closeEditor() {
      modalBackdropEl.style.display = "none";
      editingSlot = null;
    }

    function saveEditor() {
      if (!editingSlot) return;

      const name = fieldNameEl.value.trim();
      const category = fieldCategoryEl.value;
      const desc = fieldRemarkEl.value.trim();

      if (!name) {
        alert("Name darf nicht leer sein.");
        return;
      }

      let kanal = parseInt(fieldKanalEl.value, 10);
      if (editingSlot.spindleId === "DUMMY1") kanal = 1;
      if (editingSlot.spindleId === "DUMMY2") kanal = 2;

      // операция-шаблон
      let op = operations.find(o => o.name.toLowerCase() === name.toLowerCase());
      if (!op) {
        op = {
          id: "op_" + Date.now().toString(36),
          name,
          category,
          description: desc
        };
        operations.push(op);
      } else {
        op.name = name;
        op.category = category;
        op.description = desc;
      }

      let targetSpindleId = editingSlot.spindleId;

      // если выбрали другой бейдж — перекидываем между SP4/SP3
      if (editingSlot.spindleId === "SP4" || editingSlot.spindleId === "SP3") {
        if (editorSpindleBadge === "SP4") targetSpindleId = "SP4";
        if (editorSpindleBadge === "SP3") targetSpindleId = "SP3";
      }

      // очистить старый слот если поменялся шпиндель
      if (targetSpindleId !== editingSlot.spindleId) {
        plan[editingSlot.row][editingSlot.spindleId] = null;
      }

      plan[editingSlot.row][targetSpindleId] = {
        operationId: op.id,
        kanal,
        spindleBadge: editorSpindleBadge
      };

      closeEditor();
      renderPlan();
      renderLibrary();
    }

    // ---------- EVENTS ----------

    searchInputEl.addEventListener("input", (e) => {
      searchTerm = e.target.value;
      renderLibrary();
    });

    modalCloseBtn.addEventListener("click", closeEditor);
    modalCancelBtn.addEventListener("click", closeEditor);
    modalSaveBtn.addEventListener("click", saveEditor);

    modalBackdropEl.addEventListener("click", (e) => {
      if (e.target === modalBackdropEl) closeEditor();
    });

    // ---------- INIT ----------
    renderKanalToggle();
    renderPlan();
    renderCategoryTabs();
    renderLibrary();
  </script>
</body>
</html>
