<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CitiTool • Setup2</title>
<style>
:root{
  --bg:#f6f8fb; --ink:#0d1b2a; --muted:#6b7a90; --brand:#2d6cdf; --hair:#e9eef6;
  --glass:#ffffffcc; --shadow:0 10px 30px rgba(13,27,42,.08);
}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,system-ui,sans-serif}

/* AppBar */
.appbar{position:sticky;top:0;z-index:30;backdrop-filter:saturate(1.1) blur(8px);
  background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.70));border-bottom:1px solid var(--hair)}
.appbar .wrap{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo-line{display:flex;align-items:center;gap:10px}
.ct-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:conic-gradient(from 230deg at 30% 30%, #7bb0ff, #2d6cdf, #7bb0ff);color:#fff;font-weight:900;letter-spacing:.2px;box-shadow:inset 0 0 0 1px #dce7ff}
.ct-word{font:900 22px/1 "Inter",system-ui;letter-spacing:-.4px}
.ct-word b{background:linear-gradient(180deg,#0d1b2a,#2c3950);-webkit-background-clip:text;background-clip:text;color:transparent}

.actions{display:flex;align-items:center;gap:8px}
.btn{height:40px;padding:0 14px;border-radius:14px;border:1px solid #dbe5ff;background:#fff;font-weight:800}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(45,108,223,.25)}
.btn.is-sm{height:32px;border-radius:12px}

/* Search */
.search{position:relative;display:flex;align-items:center;overflow:hidden;width:44px;height:40px;border-radius:12px;transition:width .35s ease, background .2s;background:#fff;border:1px solid var(--hair);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.search.active{width:min(56vw, 260px)}
.search svg{position:absolute; left:12px; width:18px; height:18px; fill:#8aa0c4}
.search input{border:0;outline:0;width:100%;height:100%;padding:0 12px 0 38px;background:transparent;font:600 14px/1.2 Inter,system-ui;color:var(--ink)}

/* Layout */
.page{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:920px){ .page{grid-template-columns:1fr} .sidebar{order:2} .work{order:1} }

.card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow)}
.sidebar .card{padding:12px}
.work .card{padding:14px}

/* Sidebar */
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.side-list{display:grid;gap:8px;max-height:calc(100vh - 220px);overflow:auto;padding-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border:1px solid #edf1f7;border-radius:14px}
.row .title{font-weight:800}
.row .meta{color:var(--muted);font-size:13px}
.i-btn{width:36px;height:36px;border-radius:12px;border:1px solid #dbe5ff;background:#fff;font-weight:900;display:grid;place-items:center}

/* Workspace */
.ws-head{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px;align-items:start}
.ws-hero{display:grid;gap:8px}
.ws-hero img{width:100%;height:180px;border-radius:14px;border:1px solid #edf1f7;object-fit:cover;background:#f5f8ff}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:920px){ .fields{grid-template-columns:repeat(2,1fr)} }
label{font-weight:800}
input,textarea,select{border:1px solid #dbe5ff;border-radius:12px;padding:10px 12px;font-weight:700;width:100%}
textarea{min-height:60px;resize:vertical}
.ws-tabs{display:flex;gap:8px;margin-top:6px}
.tab{padding:8px 12px;border:1px solid #dbe5ff;background:#fff;border-radius:12px;font-weight:800}
.tab.active{background:#eef3ff;box-shadow:inset 0 0 0 1px #d6e5ff}
.live-badge{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:10px;background:#eef3ff;color:var(--brand);font-weight:800;padding:0 10px}

.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media (max-width:700px){ .slot-grid{grid-template-columns:repeat(2,1fr)} }
.slot{border:1px solid #edf1f7;border-radius:16px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.slot .ph{height:84px;background:#f5f8ff;display:grid;place-items:center;border-bottom:1px solid #edf1f7}
.slot .ph img{max-width:100%;max-height:84px;object-fit:cover}
.slot .meta{padding:10px}
.slot .meta .t{font-weight:800}
.slot .meta .n{color:var(--muted);font-size:13px}
.slot.open{grid-column:1/-1}
.sl-edit{border-top:1px dashed #e7ecf6;background:#fbfcff}
.sl-edit .wrap{padding:12px;display:grid;gap:8px}
.sl-edit .row{display:grid;gap:6px}
.sl-tool-picker{border:1px dashed #dbe5ff;border-radius:12px;padding:8px;display:grid;gap:8px;background:#fff}
.sl-tool-picker .tools{display:grid;gap:6px;max-height:220px;overflow:auto}
.tool-item{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;border:1px solid #edf1f7;border-radius:12px;padding:6px}
.tool-item img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#f5f8ff;border:1px solid #edf1f7}

.ws-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
.ws-actions{position:sticky;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9eef6;display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;margin-top:10px}
.muted{color:var(--muted)} .badge{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:10px;background:#eef3ff;color:var(--brand);font-weight:800;padding:0 10px}
</style>
</head>
<body>

<header class="appbar">
  <div class="wrap">
    <div class="logo-line">
      <div class="ct-badge">CT</div>
      <div class="ct-word"><b>CITI‧TOOL</b></div>
    </div>
    <div class="actions">
      <button class="btn brand" id="btnNewProg">Neues Programm</button>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.29l4.7 4.7 1.41-1.41-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
        <input type="search" placeholder="Suchen…" id="q">
      </div>
    </div>
  </div>
</header>

<main class="page">
  <!-- Sidebar: list of programs -->
  <aside class="sidebar">
    <div class="card">
      <div class="side-head">
        <div style="font-weight:900">Programme</div>
        <div>
          <button class="btn is-sm" id="btnMigrate">V1→V2</button>
        </div>
      </div>
      <div id="progList" class="side-list"></div>
    </div>
  </aside>

  <!-- Workspace -->
  <section class="work">
    <div class="card">
      <div class="ws-head">
        <div class="ws-hero">
          <img id="wsDrawing" alt="">
          <div>
            <button class="btn is-sm" id="btnChooseDrawing">Zeichnung wählen</button>
            <button class="btn is-sm" id="btnClearDrawing">Entfernen</button>
            <span class="muted" id="wsDraftDot" style="margin-left:8px;display:none">● Draft</span>
          </div>
        </div>
        <div>
          <div class="live" style="display:flex;gap:6px;justify-content:flex-end">
            <span class="live-badge" id="liveRO">Live RO</span>
            <span class="live-badge" id="liveRU">Live RU</span>
          </div>
          <div class="ws-tabs">
            <button class="tab active" data-side="RO" id="tabRO">RO</button>
            <button class="tab" data-side="RU" id="tabRU">RU</button>
            <button class="tab" data-side="SBS" id="tabSBS">Side-by-Side</button>
          </div>
        </div>
      </div>

      <div class="fields">
        <div><label>Titel</label><input id="f_title"></div>
        <div><label>Programm-Nr</label><input id="f_nr"></div>
        <div><label>Zeichnungsnummer</label><input id="f_znr"></div>
        <div><label>Material</label><input id="f_mat"></div>
      </div>

      <div class="ws-bar">
        <button class="btn is-sm" id="btnClearAll">Alle T löschen (Seite)</button>
        <button class="btn is-sm" id="btnAutoNum">Autonummer (Tpppp)</button>
        <button class="btn is-sm" id="btnCloneSide">RO⇄RU (kopieren)</button>
      </div>

      <div id="slotGrid" class="slot-grid"></div>

      <div class="ws-actions">
        <button class="btn" id="btnCancel">Abbrechen</button>
        <button class="btn brand" id="btnSave">Speichern</button>
      </div>
    </div>
  </section>
</main>

<!-- hidden file input (only library/files) -->
<input type="file" id="drawingInput" accept="image/*" style="display:none"/>

<script src="./ui/setup2.js"></script>
<script>
  // Search expand
  const box = document.getElementById('searchBox');
  const q   = document.getElementById('q');
  box.addEventListener('click', ()=>{ box.classList.add('active'); q.focus(); });
  q.addEventListener('blur', ()=>{ if(!q.value) box.classList.remove('active'); });

  // Mount Setup2
  window.addEventListener('DOMContentLoaded', ()=>{
    Setup2UI.mount({
      searchInput: q,
      listWrap: document.getElementById('progList'),
      newBtn: document.getElementById('btnNewProg'),

      drawingImg: document.getElementById('wsDrawing'),
      drawingPickBtn: document.getElementById('btnChooseDrawing'),
      drawingClearBtn: document.getElementById('btnClearDrawing'),
      drawingInput: document.getElementById('drawingInput'),

      fields: {
        title: document.getElementById('f_title'),
        nr:    document.getElementById('f_nr'),
        znr:   document.getElementById('f_znr'),
        mat:   document.getElementById('f_mat'),
      },

      tabs: {
        RO: document.getElementById('tabRO'),
        RU: document.getElementById('tabRU'),
        SBS:document.getElementById('tabSBS'),
      },

      liveBadges: {
        RO: document.getElementById('liveRO'),
        RU: document.getElementById('liveRU'),
      },

      grid: document.getElementById('slotGrid'),
      bar: {
        clearAll: document.getElementById('btnClearAll'),
        autoNum:  document.getElementById('btnAutoNum'),
        clone:    document.getElementById('btnCloneSide'),
      },

      bottom: {
        cancel: document.getElementById('btnCancel'),
        save:   document.getElementById('btnSave'),
        draftDot: document.getElementById('wsDraftDot'),
      },

      migrateBtn: document.getElementById('btnMigrate'),
    });
  });
</script>
</body>
</html>
