<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CitiTool • Dashboard</title>
  <link rel="stylesheet" href="./ui/core.css">
</head>
<body data-active="dash" class="has-bg">

<header class="appbar">
  <div class="wrap">
    <a class="ct-logo" href="./index.html">
      <span class="mark">CT</span>
      <div class="tit">
        <div class="title"><b>CitiTool</b></div>
        <div class="subtitle">Dashboard</div>
      </div>
    </a>
    <div class="actions">
      <button class="btn brand" id="ctaSetup">Neues Setup</button>
      <button class="icon-btn" id="btnSearch" title="Suche"><svg><use href="./ui/icons.svg#search"/></svg></button>
    </div>
  </div>
  <div class="searchbar collapsed" id="searchbar">
    <input type="search" id="globalSearch" placeholder="Suchen...">
  </div>
</header>

<main class="container" id="dashRoot">
  <section class="panel-xl">
    <h1>Willkommen</h1>
    <p class="muted">Schnellaktionen, Produktion & Checkliste – alles hier.</p>
    <div class="row mt">
      <button class="btn ghost sm" id="btnBackup">Backup</button>
      <button class="btn sm" id="btnRestore">Restore</button>
    </div>
  </section>

  <section class="section">
    <h2>Schnellaktionen</h2>
    <div class="stack grid2">
      <button class="btn brand" onclick="location.href='./setup.html'">Neues Setup</button>
      <button class="btn" onclick="location.href='./tools.html'">Neues Werkzeug</button>
      <button class="btn" onclick="location.href='./assist.html'">Material-Assist</button>
      <button class="btn" onclick="location.href='./docs.html'">Dokumente</button>
    </div>
  </section>

  <section class="section">
    <h2>Produktion</h2>
    <div id="prodList" class="stack"></div>
    <button class="btn brand mt" id="addJob">Neuer Auftrag</button>
  </section>

  <section class="section">
    <h2>Setup-Checkliste</h2>
    <ul id="checklist" class="checklist"></ul>
    <div class="row mt">
      <button class="btn" id="addCheck">Neuer Punkt</button>
      <button class="btn warn" id="clearDone">Abgehakte löschen</button>
    </div>
  </section>
</main>

<nav class="dock" id="dock">
  <a href="./index.html" class="active"><svg><use href="./ui/icons.svg#home"/></svg><span>Dash</span></a>
  <a href="./setup.html"><svg><use href="./ui/icons.svg#setup"/></svg><span>Setup</span></a>
  <a href="./tools.html"><svg><use href="./ui/icons.svg#tools"/></svg><span>Tools</span></a>
  <a href="./programmes.html"><svg><use href="./ui/icons.svg#list"/></svg><span>Programme</span></a>
  <a href="./docs.html"><svg><use href="./ui/icons.svg#doc"/></svg><span>Docs</span></a>
</nav>

<script src="./ui/core.js"></script>
<script src="./ui/dock.js"></script>
<script>
CT.ready(()=>{
  // Поиск плавный
  const sb=document.getElementById('searchbar');
  btnSearch.onclick=()=>sb.classList.toggle('collapsed');
});
</script>
</body>
</html>
