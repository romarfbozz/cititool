<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CitiTool • Dashboard</title>
<link rel="stylesheet" href="./ui/core.css?v=9">
</head><body>

<!-- HERO-зона -->
<section class="hero">
  <header class="appbar">
    <div class="wrap">
      <a class="ct-logo" href="./index.html">
        <span class="ct-mark">CT</span>
        <div class="ct-tit">
          <div class="title"><b>CitiTool</b></div>
          <div class="subtitle">Dashboard</div>
        </div>
      </a>
      <div class="row">
        <button class="btn brand" onclick="location.href='./setup.html'">Neues Programm</button>
        <button class="icon-btn" id="btnSearch" title="Suchen">
          <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 6.01 12.02l3.74 3.74-1.42 1.42-3.74-3.74A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
        </button>
      </div>
    </div>
    <div class="searchbar collapsed" id="searchbar">
      <form onsubmit="return false"><input id="globalSearch" type="search" placeholder="Suchen…"></form>
    </div>
  </header>

  <!-- стеклянная hero-карточка, как в heropro -->
  <div class="hero-card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div>
        <div class="muted">CitiTool</div>
        <h1 style="margin:.25rem 0 0">Setup • Tools • Docs</h1>
      </div>
      <div class="info-ico" title="Info">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm-1 2h2v7h-2V11Z"/></svg>
      </div>
    </div>
    <div class="cardline" style="margin-top:12px">
      <b>Heute</b><br><span class="muted">Produktion & Checkliste — стеклянные карточки поверх «живого» фона.</span>
    </div>
  </div>
</section>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<main class="container">
  <section class="section">
    <h2>Schnellaktionen</h2>
    <div class="stack">
      <button class="cardline" onclick="location.href='./setup.html'">Neues Setup</button>
      <button class="cardline" onclick="location.href='./tools.html'">Neues Werkzeug</button>
      <button class="cardline" onclick="location.href='./assist.html'">Material-Assist</button>
      <button class="cardline" onclick="location.href='./docs.html'">Dokumente</button>
    </div>
  </section>

  <section class="section">
    <h2>Produktion</h2>
    <div class="stack">
      <div class="cardline"><b>Los 123</b><div class="muted">20 / 100 • Heute</div></div>
      <div class="cardline"><b>Los 124</b><div class="muted">58 / 200 • Woche</div></div>
      <div class="cardline"><b>Los 125</b><div class="muted">0 / 150 • Morgen</div></div>
    </div>
  </section>

  <section class="section">
    <h2>Setup-Checkliste</h2>
    <div class="stack">
      <label class="cardline"><input type="checkbox"> Aufspann-Check</label>
      <label class="cardline"><input type="checkbox"> Nullpunkt</label>
      <label class="cardline"><input type="checkbox"> Werkzeugliste</label>
    </div>
  </section>
</main>

<!-- Dock -->
<nav class="dock">
  <a href="./index.html" class="active"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg><span>Dash</span></a>
  <a href="./setup.html"><svg viewBox="0 0 24 24"><path d="M12 2 7 7h10l-5-5Zm7 9H5v11h14V11Z"/></svg><span>Setup</span></a>
  <a href="./tools.html"><svg viewBox="0 0 24 24"><path d="M7 2h3v8H7V2Zm7 0h3v8h-3V2ZM4 14h16v8H4v-8Z"/></svg><span>Tools</span></a>
  <a href="./programmes.html"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h16v2H4v-2Z"/></svg><span>Programme</span></a>
  <a href="./docs.html"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6V2Zm9 1.5V8h4.5"/></svg><span>Docs</span></a>
</nav>

<script src="./ui/core.js?v=9"></script>
</body></html>
