<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CitiTool • Dashboard</title>
<style>
:root{
  --bg:#f6f8fb; --ink:#0d1b2a; --muted:#6b7a90; --brand:#2d6cdf; --hair:#e9eef6;
  --shadow:0 10px 30px rgba(13,27,42,.08); --dockH:78px;
}

/* Base */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,Inter,Roboto,system-ui}
.muted{color:var(--muted)}
.btn{height:38px;padding:0 14px;border-radius:12px;border:1px solid #dbe5ff;background:#fff;font-weight:800}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(45,108,223,.25)}
.inp{width:100%;border:1px solid #dbe5ff;border-radius:12px;padding:10px}

/* AppBar */
.appbar{position:sticky;top:0;z-index:30;backdrop-filter:saturate(1.1) blur(8px);
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.70));border-bottom:1px solid var(--hair)}
.appbar .wrap{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}

/* Search */
.search{position:relative;display:flex;align-items:center;overflow:hidden;width:44px;height:40px;border-radius:12px;
  transition:width .35s;background:#fff;border:1px solid var(--hair);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.search.active{width:min(56vw,260px)}
.search svg{position:absolute;left:12px;width:18px;height:18px;fill:#8aa0c4}
.search input{border:0;outline:0;width:100%;height:100%;padding:0 12px 0 38px;background:transparent;font:600 14px/1.2 Inter;color:var(--ink)}

/* Layout */
.main{max-width:1040px;margin:0 auto;padding:12px 16px calc(16px + var(--dockH) + env(safe-area-inset-bottom));display:grid;gap:14px}
.section{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.section h2{margin:2px 4px 12px;font:800 22px/1.2 Inter}

/* Checklist */
.chk-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.list{display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:1px solid #edf1f7;border-radius:12px;padding:10px;background:#fff}
.task[draggable="true"]{cursor:grab}
.drag{width:22px;text-align:center;color:#8aa0c4;font-weight:900}
.task.done .title{text-decoration:line-through;color:#8aa0c4}

/* Produktion */
.orders{display:grid;gap:10px}
.order{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid #edf1f7;border-radius:16px}
.order .t{font:900 18px/1.2 Inter}
.pbar{height:10px;border-radius:8px;background:#edf1f7;overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;background:#2d6cdf}
.badge{display:inline-grid;place-items:center;min-width:46px;height:28px;border-radius:10px;background:#eef3ff;color:#244b9a;font-weight:900;padding:0 10px}
.i-btn{width:36px;height:36px;border-radius:12px;border:1px solid #dbe5ff;background:#fff;display:grid;place-items:center}
.i-btn svg{width:18px;height:18px;fill:#2e3e55}

/* Sheet/Modal (компакт как в Docs/Setup2) */
.backdrop{position:fixed;inset:0;background:rgba(10,18,30,.35);backdrop-filter:blur(3px);z-index:900}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:910;
  width:min(640px,94vw);max-height:60vh;overflow:auto;margin:0 auto;
  background:#fff;border-top:1px solid #e9eef6;border-top-left-radius:18px;border-top-right-radius:18px;
  box-shadow:0 -12px 30px rgba(13,27,42,.12);padding:12px 14px 16px;
}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet header .close{width:32px;height:32px;border-radius:10px;border:1px solid #dbe5ff;background:#fff;display:grid;place-items:center}
.sheet h3{margin:0 0 6px;font:800 18px/1.2 Inter}
.sheet .rowf{display:grid;gap:6px;margin:6px 0}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* Feed / Recent */
.feed{display:grid;gap:8px}
.rowfeed{display:flex;gap:10px;align-items:center;border:1px solid #edf1f7;border-radius:12px;padding:10px;background:#fff}
.time{font:700 12px/1 Inter;color:#586a85;width:72px}
.text{font-weight:600}

/* KPIs */
.kpicol{display:grid;gap:8px}
.krow{display:grid;grid-template-columns:140px 1fr auto;gap:10px;align-items:center;border:1px solid #edf1f7;border-radius:12px;padding:10px}
.kname{font-weight:700}
.kbar{height:8px;border-radius:8px;background:#edf1f7;overflow:hidden}
.kbar>i{display:block;height:100%;background:#2d6cdf}
.kval{font:900 16px/1 Inter}

/* Backup */
.br-wrap{display:grid;gap:10px}
.br-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.br-actions{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:12px;color:#64748b}

/* Dock — 1:1 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
  backdrop-filter:blur(12px) saturate(1.2);background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.85));border-top:1px solid var(--hair)}
.dock .wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.dock a{display:grid;justify-items:center;gap:4px;padding:10px;border-radius:14px;text-decoration:none;color:inherit}
.dock a small{font-weight:600;font-size:12px;color:#344966}
.dock a.active{background:#eef3ff;box-shadow:inset 0 0 0 1px #d6e5ff}
.icon{width:22px;height:22px;fill:#2e3e55}

/* === ЖЁСТКИЙ ОВЕРРАЙД ЛОГО (точно как в Docs/Setup2) === */
header.appbar .wrap .ct-badge{
  width:26px !important; height:26px !important; aspect-ratio:1/1 !important;
  border-radius:8px !important; display:grid !important; place-items:center !important;
  background:conic-gradient(from 230deg at 30% 30%, #7bb0ff,#2d6cdf,#7bb0ff) !important;
  color:#fff !important; font:900 10px/1 Inter,system-ui !important; letter-spacing:.2px !important;
  box-shadow:inset 0 0 0 1px #dce7ff !important; flex:0 0 auto !important;
}
header.appbar .wrap .ct-word{
  font:900 15px/1 "Inter",system-ui !important; letter-spacing:-.2px !important;
}
header.appbar .wrap .ct-word b{
  background:linear-gradient(180deg,#0d1b2a,#2c3950) !important;
  -webkit-background-clip:text !important; background-clip:text !important; color:transparent !important;
}
</style>
</head>
<body>

<!-- AppBar -->
<header class="appbar">
  <div class="wrap">
    <!-- ВАЖНО: используем ct-badge / ct-word, как в остальных модулях -->
    <div class="logo-line">
      <div class="ct-badge">CT</div>
      <div class="ct-word"><b>CITI‧TOOL</b></div>
    </div>
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.29l4.7 4.7 1.41-1.41-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
      <input type="search" placeholder="Suchen…" id="q"/>
    </div>
  </div>
</header>

<main class="main">
  <!-- Setup-Checkliste -->
  <section class="section">
    <h2>Setup-Checkliste</h2>
    <div class="chk-head">
      <input id="newItem" class="inp" placeholder="Neuer Punkt… (Enter)" />
      <button id="addItem" class="btn">+ Hinzufügen</button>
      <button id="delDone" class="btn">Erledigte entfernen</button>
      <span class="muted">Tipp: перетаскивай строку за ≡</span>
    </div>
    <div id="chkList" class="list"></div>
  </section>

  <!-- Produktion -->
  <section class="section">
    <h2>Produktion</h2>
    <div class="orders" id="orders"></div>
  </section>

  <!-- Letzte Aktionen -->
  <section class="section">
    <h2>Letzte Aktionen</h2>
    <div class="feed" id="feed"></div>
  </section>

  <!-- Zuletzt hinzugefügt -->
  <section class="section">
    <h2>Zuletzt hinzugefügt</h2>
    <div class="feed" id="recent"></div>
  </section>

  <!-- Übersicht -->
  <section class="section">
    <h2>Übersicht</h2>
    <div class="kpicol" id="kpis"></div>
  </section>

  <!-- Backup -->
  <section class="section">
    <div class="br-head">
      <h2 style="margin:0">Backup & Restore</h2>
    </div>
    <div class="br-wrap">
      <div class="small muted" id="bkStatus">—</div>
      <div class="br-actions">
        <button class="btn brand" id="doBackup">Backup erstellen</button>
        <input type="file" id="fileRestore" accept="application/json" style="display:none"/>
        <button class="btn" id="doRestore">Wiederherstellen…</button>
      </div>
      <div class="small">Sichert alle lokalen <b>CT_*</b>-Daten в один JSON и позволяет восстановить их später.</div>
    </div>
  </section>
</main>

<!-- Dock -->
<nav class="dock" id="dock">
  <div class="wrap">
    <a href="./index.html" class="active"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg><small>Dash</small></a>
    <a href="./setup2.html"><svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 10-7.08 7.06 7 7 0 007.08-7.06zM11 6h2v6h-2V6zm0 8h2v2H11v-2z"/></svg><small>Setup</small></a>
    <a href="./tools.html"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19l-8-8 2-2 8 8-2 2zM14.3 7.7l-1-1L9 11v2h2l4.3-4.3zM7 2l3 3-2 2-3-3L7 2zM2 7l3 3-2 2-3-3L2 7zM3 14h6v8H3z"/></svg><small>Tools</small></a>
    <a href="./programme.html"><svg class="icon" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 4h12v2H3V8zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg><small>Programme</small></a>
    <a href="./docs.html"><svg class="icon" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5"/></svg><small>Docs</small></a>
    <a href="./assist.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><small>Assist</small></a>
  </div>
</nav>

<script>
/* Search expand */
const box=document.getElementById('searchBox'), q=document.getElementById('q');
box.addEventListener('click', ()=>{ box.classList.add('active'); q.focus(); });
q.addEventListener('blur', ()=>{ if(!q.value) box.classList.remove('active'); });

/* Storage helpers */
const S={get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch{ return def}}, set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const now=()=>Date.now(), uid=()=>Math.random().toString(36).slice(2,10);
const K={ PROG:'CT_PROGS_V1', TOOLS:'CT_TOOLS_V1', DOCS:'CT_DOCS_V1', PROD:'CT_PROD_V1', CHECK:'CT_CHECK_V1', BK:'CT_BACKUP_INFO_V1' };

/* Seeds */
(function(){
  if(!Array.isArray(S.get(K.PROD))) S.set(K.PROD,[]);
  if(S.get(K.PROD).length===0){
    const a=[]; for(let i=1;i<=5;i++) a.push({id:uid(),name:'Los '+(231+i),done:20*i,total:120+i*20,due:new Date(Date.now()+i*864e5).toISOString().slice(0,10),notes:'',createdAt:now(),updatedAt:now()});
    S.set(K.PROD,a);
  }
  if(!Array.isArray(S.get(K.CHECK))) S.set(K.CHECK,[
    {id:uid(),text:'Werkzeugdaten laden',done:false,sort:1,createdAt:now(),updatedAt:now()},
    {id:uid(),text:'Spannung prüfen',done:false,sort:2,createdAt:now(),updatedAt:now()},
  ]);
  if(!S.get(K.BK)) S.set(K.BK,{lastBackupAt:0});
})();

/* Checklist */
const elList=document.getElementById('chkList');
function loadCheck(){return (S.get(K.CHECK,[])||[]).sort((a,b)=>a.sort-b.sort||b.createdAt-a.createdAt);}
function saveCheck(a){S.set(K.CHECK,a);}
function renderCheck(){
  elList.innerHTML='';
  const arr=loadCheck();
  if(!arr.length){const e=document.createElement('div'); e.className='muted'; e.textContent='Noch nichts…'; elList.append(e); return;}
  arr.forEach(it=>{
    const row=document.createElement('div'); row.className='task'+(it.done?' done':''); row.draggable=true; row.dataset.id=it.id;
    row.innerHTML=`<div class="drag">≡</div>
      <label class="title" style="display:flex;gap:10px;align-items:center">
        <input type="checkbox" ${it.done?'checked':''}/>
        <span>${it.text}</span>
      </label>
      <button class="btn" data-del>Del</button>`;
    row.querySelector('input').onchange=(e)=>{it.done=e.target.checked; it.updatedAt=now(); const a=loadCheck(); const i=a.findIndex(x=>x.id===it.id); a[i]=it; saveCheck(a); renderCheck();};
    row.querySelector('[data-del]').onclick=()=>{saveCheck(loadCheck().filter(x=>x.id!==it.id)); renderCheck();};
    row.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',it.id);ev.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragover',ev=>{ev.preventDefault();ev.dataTransfer.dropEffect='move';});
    row.addEventListener('drop',ev=>{
      ev.preventDefault();
      const fromId=ev.dataTransfer.getData('text/plain'); if(!fromId||fromId===it.id) return;
      const list=loadCheck(); const fi=list.findIndex(x=>x.id===fromId); const ti=list.findIndex(x=>x.id===it.id);
      const [m]=list.splice(fi,1); list.splice(ti,0,m); list.forEach((x,i)=>x.sort=i+1); saveCheck(list); renderCheck();
    });
    elList.append(row);
  });
}
document.getElementById('addItem').onclick=()=>{const t=document.getElementById('newItem'); const s=(t.value||'').trim(); if(!s) return;
  const a=loadCheck(); const max=a.reduce((m,x)=>Math.max(m,x.sort||0),0);
  a.push({id:uid(),text:s,done:false,sort:max+1,createdAt:now(),updatedAt:now()}); saveCheck(a); t.value=''; renderCheck();};
document.getElementById('newItem').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('addItem').click(); }});
document.getElementById('delDone').onclick=()=>{ saveCheck(loadCheck().filter(x=>!x.done)); renderCheck(); };

/* Orders */
const wrapOrders=document.getElementById('orders');
const pct=o=>{const t=Math.max(1,Number(o.total||0));const d=Math.max(0,Number(o.done||0));return Math.min(100,Math.round(d*100/t));};
function loadOrders(){return (S.get(K.PROD,[])||[]).sort((a,b)=>b.createdAt-a.createdAt);}
function saveOrders(a){S.set(K.PROD,a);}
function renderOrders(){
  wrapOrders.innerHTML='';
  loadOrders().forEach(o=>{
    const card=document.createElement('div'); card.className='order';
    const left=document.createElement('div');
    left.innerHTML=`<div class="t">${o.name}</div>
      <div class="pbar"><i style="width:${pct(o)}%"></i></div>
      <div class="muted" style="margin-top:8px">${o.due||'—'}</div>`;
    const right=document.createElement('div'); right.style.display='flex'; right.style.gap='8px'; right.style.alignItems='center';
    const badge=document.createElement('span'); badge.className='badge'; badge.textContent=pct(o)+'%';
    const info=document.createElement('button'); info.className='i-btn'; info.title='Details';
    info.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>`;
    info.onclick=()=>openOrderSheet(o);
    right.append(badge,info);
    card.append(left,right);
    wrapOrders.append(card);
  });
}

/* Sheet */
function openOrderSheet(order){
  const back=document.createElement('div'); back.className='backdrop';
  const sheet=document.createElement('div'); sheet.className='sheet';
  sheet.innerHTML=`
    <header>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="ct-badge">CT</div><div class="ct-word"><b>CITI‧TOOL</b></div>
      </div>
      <button class="close" title="Schließen">✕</button>
    </header>
    <h3>${order.name}</h3>
    <div class="rowf"><label>Done</label><input id="fD" type="number" class="inp" value="${order.done||0}"></div>
    <div class="rowf"><label>Total</label><input id="fT" type="number" class="inp" value="${order.total||0}"></div>
    <div class="rowf"><label>Fällig bis</label><input id="fDue" type="date" class="inp" value="${order.due||''}"></div>
    <div class="rowf"><label>Notizen</label><textarea id="fN" class="inp" rows="3">${order.notes||''}</textarea></div>
    <div class="btns">
      <button class="btn" id="m10">-10</button>
      <button class="btn" id="p10">+10</button>
      <span style="flex:1"></span>
      <button class="btn" id="del">Löschen</button>
      <button class="btn brand" id="save">Speichern</button>
    </div>`;
  const lock=()=>{document.body.style.overflow='hidden'}; const unlock=()=>{document.body.style.overflow=''}
  lock(); document.body.append(back,sheet);
  back.addEventListener('click',()=>{sheet.remove(); back.remove(); unlock();});
  sheet.querySelector('.close').onclick=()=>{back.click()};
  sheet.querySelector('#m10').onclick=()=>{const d=sheet.querySelector('#fD'); d.value=Math.max(0,Number(d.value||0)-10);};
  sheet.querySelector('#p10').onclick=()=>{const d=sheet.querySelector('#fD'); d.value=Number(d.value||0)+10;};
  sheet.querySelector('#del').onclick=()=>{ if(confirm('Auftrag löschen?')){ saveOrders(loadOrders().filter(x=>x.id!==order.id)); renderAll(); back.click(); } };
  sheet.querySelector('#save').onclick=()=>{
    order.done=Number(sheet.querySelector('#fD').value||0);
    order.total=Number(sheet.querySelector('#fT').value||0);
    order.due=sheet.querySelector('#fDue').value||'';
    order.notes=sheet.querySelector('#fN').value||'';
    order.updatedAt=Date.now();
    const arr=loadOrders(); const i=arr.findIndex(x=>x.id===order.id); if(i>=0) arr[i]=order; saveOrders(arr);
    renderAll(); back.click();
  };
}

/* Feed / Recent / KPIs / Backup */
function renderFeed(){
  const mk=(arr,fmt)=> (arr||[]).map(x=>({t:x.updatedAt||x.createdAt||0, txt:fmt(x)}));
  const tools=mk(S.get('CT_TOOLS_V1',[]), x=>`Werkzeug ${x.name||x.code||''} gespeichert`);
  const docs =mk(S.get('CT_DOCS_V1' ,[]), x=>`Dokument „${x.title||'—'}“ geändert`);
  const prod =mk(S.get(K.PROD ,[]), x=>`Auftrag ${x.name||'—'} aktualisiert`);
  const all=[...tools,...docs,...prod].sort((a,b)=>b.t-a.t).slice(0,3);
  const fmtTime=(t)=>{ const d=new Date(t); const T=new Date();
    if(d.toDateString()===T.toDateString()) return d.toTimeString().slice(0,5);
    const y=new Date(T); y.setDate(T.getDate()-1); if(d.toDateString()===y.toDateString()) return 'Gestern';
    return d.toLocaleDateString(); };
  const feed=document.getElementById('feed'); feed.innerHTML='';
  if(all.length===0){const e=document.createElement('div'); e.className='muted'; e.textContent='Noch nichts…'; feed.append(e); return;}
  all.forEach(it=>{
    const row=document.createElement('div'); row.className='rowfeed';
    row.innerHTML=`<div class="time">[${fmtTime(it.t)}]</div><div class="text">${it.txt}</div>`;
    feed.append(row);
  });
}
function renderRecent(){
  const recent=document.getElementById('recent'); recent.innerHTML='';
  const tools=(S.get('CT_TOOLS_V1',[])||[]).sort((a,b)=>b.createdAt-a.createdAt).slice(0,3)
                .map(t=>({t: t.createdAt, type:'Tool', name:t.name, sub:t.category||'', img:!!t.photo}));
  const docs =(S.get('CT_DOCS_V1' ,[])||[]).sort((a,b)=>b.createdAt-a.createdAt).slice(0,3)
                .map(d=>({t: d.createdAt, type:'Dok',  name:d.title, sub:d.category||'', img:!!d.imgData}));
  const list=[...tools,...docs].sort((a,b)=>b.t-a.t);
  if(!list.length){const e=document.createElement('div'); e.className='muted'; e.textContent='Noch nichts…'; recent.append(e); return;}
  const fmt=(t)=>{const d=new Date(t); return d.toTimeString().slice(0,5);}
  list.forEach(x=>{
    const row=document.createElement('div'); row.className='rowfeed';
    row.innerHTML=`<div class="time">[${fmt(x.t)}]</div><span class="pill"> ${x.type} </span>
      <div class="text" style="flex:1">${x.name}</div><div class="muted">${x.sub||''}${x.img?' · img':''}</div>`;
    recent.append(row);
  });
}
function drawKpis(){
  const progs=S.get(K.PROG,[]), tools=S.get('CT_TOOLS_V1',[]), docs=S.get('CT_DOCS_V1',[]), prod=S.get(K.PROD,[]);
  const doneCnt=prod.filter(o=>o.done>=o.total && o.total>0).length;
  const mean = prod.length? Math.round(prod.reduce((s,o)=>s+Math.min(100,Math.round((o.done||0)*100/Math.max(1,(o.total||0)))),0)/prod.length) : 0;
  const total=(progs.length+tools.length+docs.length+prod.length);
  const todayCnt=(arr)=>arr.filter(x=> new Date(x.updatedAt||0).toDateString()===new Date().toDateString()).length;
  const rows=[
    {name:'Programme', val:progs.length, type:'count'},
    {name:'Werkzeuge', val:tools.length, type:'count'},
    {name:'Dokumente', val:docs.length, type:'count'},
    {name:'Aufträge',  val:prod.length, type:'count'},
    {name:'Ø Fortschritt', val:mean, type:'bar'},
    {name:'Aktivität heute', val:todayCnt(tools)+todayCnt(docs)+todayCnt(prod), type:'count'},
    {name:'Erledigt', val:doneCnt, type:'count'},
    {name:'Speicher (Einträge)', val:total, type:'count'},
  ];
  const k=document.getElementById('kpis'); k.innerHTML='';
  rows.forEach(r=>{
    const row=document.createElement('div'); row.className='krow';
    row.innerHTML=`<div class="kname">${r.name}</div>${r.type==='bar'?'<div class="kbar"><i style="width:'+r.val+'%"></i></div>':'<div></div>'}<div class="kval">${r.type==='bar'? r.val+' %' : r.val}</div>`;
    k.append(row);
  });
}

/* Backup */
function renderBackup(){
  const info=S.get(K.BK,{lastBackupAt:0});
  const el=document.getElementById('bkStatus'); const ts=info.lastBackupAt||0;
  el.textContent = ts ? ('Letztes Backup: '+new Date(ts).toLocaleString()) : 'Noch kein Backup erstellt.';
}
document.getElementById('doBackup').onclick=()=>{
  const KEYS=['CT_PROGS_V1','CT_TOOLS_V1','CT_DOCS_V1','CT_PROD_V1','CT_CHECK_V1','CT_DOC_CATS_V1','CT_TOOL_CATS_V1','CT_LIVE_V1','CT_AS_MAT_PRESETS_V1','CT_AS_MAT_HISTORY_V1','CT_AS_FASEN_PRESETS_V1','CT_AS_PASS_TABLE_V1'];
  const out={}; KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!==null) out[k]=JSON.parse(v); });
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='citi_backup.json'; a.click(); URL.revokeObjectURL(a.href);
  S.set(K.BK,{lastBackupAt:Date.now()}); renderBackup();
};
document.getElementById('doRestore').onclick=()=>document.getElementById('fileRestore').click();
document.getElementById('fileRestore').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(typeof data!=='object' || Array.isArray(data)) return alert('Falsches Format');
    if(!confirm('Alle Daten überschreiben?')) return;
    Object.keys(data).forEach(k=> localStorage.setItem(k, JSON.stringify(data[k])));
    alert('Daten wiederhergestellt'); renderAll();
  }catch{ alert('Fehler beim Wiederherstellen'); }
});

/* Dock padding */
function padDock(){
  const h=Math.round(document.getElementById('dock').getBoundingClientRect().height);
  document.documentElement.style.setProperty('--dockH', h+'px');
}
padDock(); new ResizeObserver(padDock).observe(document.getElementById('dock'));

/* Render all */
function renderAll(){ renderCheck(); renderOrders(); renderFeed(); renderRecent(); drawKpis(); renderBackup(); }
renderAll();
</script>
