<!doctype html><html lang="ru"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CitiTool — Dashboard</title>
<link rel="stylesheet" href="./ui/core.css"/>
<script src="./ui/core.js" defer></script>
<script src="./ui/widgets.js" defer></script>
</head><body>
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  const page = CT.initPage({
    title:'Dashboard', subtitle:'Сегодня',
    active:'dash',
    search:{ onQuery:q=> console.log('search dash', q) },
    actions:[ {label:'Backup', onClick:()=>CT.backup()} ]
  });

  // Schnellaktionen
  const quick = CT.el(`<div class="grid cols-3">
    <div class="card"><div style="font-weight:700">Setup-Checkliste</div><div class="hint">Быстрый доступ</div><a class="btn" href="./setup.html" style="margin-top:8px">Открыть</a></div>
    <div class="card"><div style="font-weight:700">Шкаф инструментов</div><div class="hint">Просмотр/CRUD</div><a class="btn" href="./tools.html" style="margin-top:8px">Открыть</a></div>
    <div class="card"><div style="font-weight:700">Документы</div><div class="hint">Новые сверху</div><a class="btn" href="./docs.html" style="margin-top:8px">Открыть</a></div>
  </div>`);
  page.append(quick);

  // Produktion (заглушка с прогрессом)
  page.append(CT.el(`<div style="height:10px"></div>`));
  page.append(CT.el(`<div class="card"><div style="font-weight:700;margin-bottom:8px">Produktion</div></div>`))
    .append(CT.progress({value:32, max:100}));
});
</script>
</body></html>
