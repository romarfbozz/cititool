<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CitiTool • Assist</title>
<link rel="stylesheet" href="./ui/neo.css">
<style>
.table{width:100%;border-collapse:separate;border-spacing:0 8px}
.table th,.table td{padding:10px;border:1px solid #edf1f7}
.table th{background:#f7f9ff;font-weight:800;text-align:left}
.table td:first-child,.table th:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px}
.table td:last-child,.table th:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}
.badge-warn{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:10px;background:#fff4d6;color:#8a5a00;font-weight:800;padding:0 10px}
.badge-info{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:10px;background:#eef3ff;color:#2d6cdf;font-weight:800;padding:0 10px}
.codebox{border:1px solid #edf1f7;border-radius:12px;padding:10px;background:#fff;white-space:pre;overflow:auto;max-height:40vh}
.grp{display:grid;gap:10px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:12px;color:#6b7a90}
/* Tabs */
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{padding:8px 12px;border:1px solid #dbe5ff;background:#fff;border-radius:12px;font-weight:800;cursor:pointer}
.tab.active{background:#eef3ff;box-shadow:inset 0 0 0 1px #d6e5ff}
.hidden{display:none !important}
</style>
</head>
<body>

<div class="hero-bg"><div class="hero-grid"></div></div>

<header class="appbar">
  <div class="wrap">
    <div class="logo-line">
      <div class="ct-badge">CT</div>
      <div class="ct-word"><b>CITI‧TOOL</b></div>
    </div>
    <div class="actions">
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.29l4.7 4.7 1.41-1.41-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
        <input type="search" placeholder="Suchen…" id="q" autocomplete="off">
      </div>
    </div>
  </div>
</header>

<main class="main">

  <!-- Tabs -->
  <div class="section">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="mat">Material • Schnittdaten</button>
      <button class="tab" data-tab="fas">Fasen • Geometrie & G-Code</button>
      <button class="tab" data-tab="pass">Passmassen</button>
    </div>
  </div>

  <!-- MATERIAL -->
  <section class="section" id="secMat">
    <h2>Material • Schnittdaten</h2>
    <div class="grp" id="matFormWrap"></div>
    <div class="row-btns">
      <button class="btn" id="btnMatCalc">Rechnen</button>
      <button class="btn btn--outline" id="btnMatToNote">Als Notiz speichern</button>
      <button class="btn btn--outline is-sm" id="btnMatPresets">Presets…</button>
    </div>
    <div id="matOut" style="margin-top:8px"></div>
    <div style="margin-top:12px">
      <div class="small" style="margin-bottom:6px">Zuletzt gerechnet</div>
      <div class="list" id="matHistory"></div>
    </div>
  </section>

  <!-- FASEN -->
  <section class="section hidden" id="secFasen">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px">
      <h2 style="margin:0">Fasen • Geometrie & G-Code</h2>
      <button class="btn btn--outline is-sm" id="btnFasenPresets">Presets…</button>
    </div>
    <div class="grp" id="fasFormWrap"></div>
    <div class="row-btns">
      <button class="btn" id="btnFasenSolve">Berechnen</button>
      <button class="btn btn--outline" id="btnFasenGcode">G-Code…</button>
    </div>
    <div id="fasOut" style="margin-top:8px"></div>
  </section>

  <!-- PASSMASSEN -->
  <section class="section hidden" id="secPass">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px">
      <h2 style="margin:0">Passmassen</h2>
      <button class="btn btn--outline is-sm" id="btnPassTable">Tabelle…</button>
    </div>
    <div class="grp" id="passFormWrap"></div>
    <div class="row-btns">
      <button class="btn" id="btnPassSearch">Suchen</button>
    </div>
    <div id="passOut" style="margin-top:8px"></div>
  </section>

</main>

<nav class="dock">
  <div class="wrap">
    <a href="./index.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg><small>Dash</small></a>
    <a href="./setup.html"><svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 10-7.08 7.06 7 7 0 007.08-7.06zM11 6h2v6h-2V6zm0 8h2v2h-2v-2z"/></svg><small>Setup</small></a>
    <a href="./tools.html"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19l-8-8 2-2 8 8-2 2zM14.3 7.7l-1-1L9 11v2h2l4.3-4.3zM7 2l3 3-2 2-3-3L7 2zM2 7l3 3-2 2-3-3L2 7zM3 14h6v8H3z"/></svg><small>Tools</small></a>
    <a href="./setup.html"><svg class="icon" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 4h12v2H3V8zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg><small>Programme</small></a>
    <a href="./assist.html" class="active"><svg class="icon" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5"/><path d="M8 13h8v2H8zM8 17h8v2H8z"/></svg><small>Assist</small></a>
  </div>
</nav>

<script src="./ui/neo.js"></script>
<script src="./ui/docs.js"></script>
<script src="./ui/assist.js"></script>
<script>
/* ========== каркас ========== */
CT.neo.wireSearch(document.getElementById('searchBox'), document.getElementById('q'));
CT.neo.shrinkOnScroll();
CT.neo.setActiveDock('assist');
Ass.ensureSeeds();

/* ========== Табы — строго три секции ========== */
const tabs = document.getElementById('tabs');
const sections = {
  mat: document.getElementById('secMat'),
  fas: document.getElementById('secFasen'),
  pass: document.getElementById('secPass')
};
tabs.addEventListener('click', (e)=>{
  const b = e.target.closest('.tab'); if(!b) return;
  tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const key = b.dataset.tab;
  Object.entries(sections).forEach(([k,el])=> el.classList.toggle('hidden', k!==key));
});

/* ===== MATERIAL ===== */
const matFormWrap = document.getElementById('matFormWrap');
const matOut = document.getElementById('matOut');
const matHistory = document.getElementById('matHistory');

const matPresets = Ass.material.listPresets({procedure:'drehen'});
const matOptions = matPresets.map(p => `${p.name} (${p.mode})`);

const matForm = CT.ui.form.create({
  values: { material: matOptions[0]||'', D:'', Vc:'', fn:'' },
  fields: [
    {type:'select', key:'material', label:'Material/Mode', options: matOptions},
    {type:'number', key:'D', label:'Ø (mm)', min:0, step:'0.01'},
    {type:'number', key:'Vc', label:'Vc (m/min)', min:0, step:'1'},
    {type:'number', key:'fn', label:'fn (mm/U)', min:0, step:'0.01'}
  ]
});
matFormWrap.append(matForm.el);

function applyMaterialDefaults(sel){
  const m = sel.match(/^(.+?)\s+\((.+)\)$/); if(!m) return;
  const def = Ass.material.suggestDefaults(m[1], m[2]); if(def){ matForm.setValues({ Vc:def.Vc, fn:def.fn }); }
}
applyMaterialDefaults(matForm.getValues().material);
matForm.el.querySelector('select[name="material"]').addEventListener('change', (e)=> applyMaterialDefaults(e.target.value));

let lastMatResult = null;
document.getElementById('btnMatCalc').onclick = ()=>{
  const v = matForm.getValues(); const m=v.material.match(/^(.+?)\s+\((.+)\)$/)||[];
  const input = { material:m[1]||'', D:Number(v.D), Vc:Number(v.Vc), fn:Number(v.fn) };
  const res = Ass.material.calc(input, {}); lastMatResult = res; Ass.material.history.add(res);
  matOut.innerHTML='';
  const info=document.createElement('div'); info.className='list';
  const r1=document.createElement('div'); r1.className='row'; r1.innerHTML=`<div class="title">n</div><div class="badge">${res.n} 1/min</div>`;
  const r2=document.createElement('div'); r2.className='row'; r2.innerHTML=`<div class="title">Vf</div><div class="badge">${res.Vf} mm/min</div>`;
  info.append(r1,r2);
  if((res.warnings||[]).length){ const w=document.createElement('div'); w.style.marginTop='8px'; res.warnings.forEach(s=>{ const b=document.createElement('span'); b.className='badge-warn'; b.textContent=s; b.style.marginRight='6px'; w.append(b);}); matOut.append(w); }
  if((res.info||[]).length){ const i=document.createElement('div'); i.style.marginTop='6px'; res.info.forEach(s=>{ const b=document.createElement('span'); b.className='badge-info'; b.textContent=s; b.style.marginRight='6px'; i.append(b);}); matOut.append(i); }
  matOut.append(info); renderMatHistory();
};
document.getElementById('btnMatToNote').onclick = ()=>{
  if(!lastMatResult){ CT.ui.toast('Nichts zu speichern','warn'); return; }
  const note = Ass.material.toNote(lastMatResult);
  Docs.create({ title:note.title, category:note.category, tags:note.tags, text:note.text });
  CT.ui.toast('Als Notiz gespeichert','ok');
};
function renderMatHistory(){
  matHistory.innerHTML=''; const arr=Ass.material.history.list(5);
  if(!arr.length){ matHistory.innerHTML='<div class="muted">Keine Einträge</div>'; return; }
  arr.forEach(r=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div><div class="title">Ø ${r.input.D} • Vc ${r.input.Vc} • fn ${r.input.fn}</div><div class="meta">${new Date(r.createdAt).toLocaleString()}</div></div>`;
    const right=document.createElement('div'); const b=document.createElement('button'); b.className='btn btn--outline is-sm'; b.textContent='Übernehmen';
    b.onclick=()=>{ matForm.setValues({ D:r.input.D, Vc:r.input.Vc, fn:r.input.fn }); };
    right.append(b); row.append(right); matHistory.append(row);
  });
}
renderMatHistory();

/* ===== FASEN (с Z) ===== */
const fasForm = CT.ui.form.create({
  values: { angle:45, Xstart:'', Xend:'', L:'', Zstart:'', Zend:'' },
  fields: [
    {type:'number', key:'angle',  label:'Winkel (°)', min:1, max:89, step:'0.1'},
    {type:'number', key:'Xstart', label:'Xstart (mm)', step:'0.001'},
    {type:'number', key:'Xend',   label:'Xend (mm)',   step:'0.001'},
    {type:'number', key:'L',      label:'L (Z-Projektion, mm)', step:'0.001'},
    {type:'number', key:'Zstart', label:'Zstart (mm)', step:'0.001'},
    {type:'number', key:'Zend',   label:'Zend (mm)',   step:'0.001'}
  ]
});
document.getElementById('fasFormWrap').append(fasForm.el);

const fasOut = document.getElementById('fasOut');
let fasSolved = null;
CT.__round = CT.__round || ((v,p)=>{ const m=Math.pow(10,p|0); return Math.round((+v+Number.EPSILON)*m)/m; });

document.getElementById('btnFasenSolve').onclick = ()=>{
  const v = fasForm.getValues();
  const numOrU = (x)=> (x===''||x==null) ? undefined : Number(x);
  const s = Ass.fasen.solve({
    angle:Number(v.angle),
    Xstart:numOrU(v.Xstart),
    Xend:numOrU(v.Xend),
    L:numOrU(v.L),
    Zstart:numOrU(v.Zstart),
    Zend:numOrU(v.Zend)
  });
  fasSolved = s;

  fasOut.innerHTML='';
  if ((s.errors||[]).length){
    const err=document.createElement('div');
    s.errors.forEach(e=>{ const b=document.createElement('span'); b.className='badge-warn'; b.textContent=e; b.style.marginRight='6px'; err.append(b); });
    fasOut.append(err);
  }
  if (s.valid){
    const list=document.createElement('div'); list.className='list';
    list.innerHTML = `
      <div class="row"><div class="title">Xstart</div><div class="badge">${CT.__round(s.Xstart,3)}</div></div>
      <div class="row"><div class="title">Xend</div><div class="badge">${CT.__round(s.Xend,3)}</div></div>
      <div class="row"><div class="title">L (Z)</div><div class="badge">${CT.__round(s.L,3)} mm</div></div>
      <div class="row"><div class="title">Tiefe</div><div class="badge">${CT.__round(s.depth,3)} mm</div></div>
    `;
    if (typeof s.Zstart==='number' || typeof s.Zend==='number'){
      const z=document.createElement('div'); z.className='row';
      z.innerHTML = `<div class="title">Z</div><div class="badge">${ typeof s.Zstart==='number'&&typeof s.Zend==='number' ? `${CT.__round(s.Zstart,3)} → ${CT.__round(s.Zend,3)}` : (typeof s.Zend==='number' ? `? → ${CT.__round(s.Zend,3)}` : `${CT.__round(s.Zstart,3)} → ?`) }</div>`;
      list.append(z);
    }
    fasOut.append(list);
  }
};

document.getElementById('btnFasenGcode').onclick = ()=>{
  if(!fasSolved || !fasSolved.valid){ CT.ui.toast('Erst berechnen', 'warn'); return; }
  const fform = CT.ui.form.create({
    values:{ side:'ro', feed:0.15, toolT:'T0101' },
    fields:[
      {type:'select', key:'side', label:'Seite', options:['ro','ru']},
      {type:'number', key:'feed', label:'F (Feed)', step:'0.001'},
      {type:'text', key:'toolT', label:'T (optional)'}
    ]
  });

  const box=document.createElement('div');
  const codeEl=document.createElement('div'); codeEl.className='codebox';
  const renderCode=()=>{
    const o=fform.getValues();
    const out=Ass.fasen.gcode(fasSolved, { side:o.side, feed:Number(o.feed), toolT:o.toolT||undefined });
    codeEl.textContent = (out.lines||[]).join('\n');
  }; renderCode();

  fform.el.addEventListener('input', renderCode);
  box.append(fform.el, codeEl);

  CT.ui.modal.open({
    title:'G-Code für Fase',
    contentEl:box,
    footer:[
      {label:'Kopieren', onClick:()=>{ CT.copy(codeEl.textContent); CT.ui.toast('Kopiert','ok'); }},
      {label:'Als Notiz speichern', onClick:()=>{
        const o=fform.getValues();
        const out=Ass.fasen.gcode(fasSolved, { side:o.side, feed:Number(o.feed), toolT:o.toolT||undefined });
        Docs.create({ title:`Fase ${CT.__round(fasSolved.angle,1)}°`, category:'Setup', text: out.note + '\n' + (out.lines||[]).join('\n') });
        CT.ui.toast('Gespeichert','ok');
      }},
      {label:'Schließen', onClick:()=>CT.ui.modal.close()}
    ],
    wide:true
  });
};

/* ===== PASSMASSEN ===== */
const passForm = CT.ui.form.create({
  values:{ raw:'' },
  fields:[ {type:'text', key:'raw', label:'Eingabe (z.B. "d12 h6" oder "H7/g6" oder "D=25 H7")'} ]
});
document.getElementById('passFormWrap').append(passForm.el);

const passOut = document.getElementById('passOut');
document.getElementById('btnPassSearch').onclick = ()=>{
  const v=passForm.getValues(); const r=Ass.pass.search(v.raw||''); passOut.innerHTML='';
  function renderSide(name, res){
    const box=document.createElement('div'); box.style.marginTop='8px';
    const h=document.createElement('div'); h.className='title'; h.textContent=name; box.append(h);
    if(res && res.ok){
      const t=document.createElement('table'); t.className='table';
      t.innerHTML=`<thead><tr><th>Nominal</th><th>Symbol</th><th>Unteres</th><th>Oberes</th><th>Bereich</th></tr></thead>
        <tbody><tr><td>${res.entry.nominal}</td><td>${res.entry.symbol}</td><td>${res.entry.lower}</td><td>${res.entry.upper}</td>
        <td>${res.entry.nominal + res.entry.lower} .. ${res.entry.nominal + res.entry.upper}</td></tr></tbody>`;
      box.append(t);
    } else if (res){
      const w=document.createElement('div'); w.className='muted'; w.textContent=res.text||'Keine Treffer'; box.append(w);
    }
    return box;
  }
  if (r.shaft) passOut.append(renderSide('Schaft (Welle)', r.shaft));
  if (r.hole)  passOut.append(renderSide('Bohrung (Loch)', r.hole));
  if (!r.shaft && !r.hole){ passOut.textContent='Keine erkennbaren Angaben'; }
};

/* мелочь */
CT.__round = CT.__round || ((v,p)=>{ const m=Math.pow(10,p|0); return Math.round((+v+Number.EPSILON)*m)/m; });
</script>
</body>
</html>
