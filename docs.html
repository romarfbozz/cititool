<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CITI•TOOL — Dokumente</title>

<!-- Базовые стили страницы (минимум, в твоём проекте часть уже есть) -->
<style>
:root{
  --bg:#f6f8fb; --ink:#0d1b2a; --muted:#6b7a90; --brand:#2d6cdf; --hair:#e9eef6;
  --r:18px; --shadow:0 10px 30px rgba(13,27,42,.08);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,Inter,system-ui}
.appbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#fff,rgba(255,255,255,.85));border-bottom:1px solid var(--hair);backdrop-filter:saturate(1.1) blur(8px)}
.appbar .wrap{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.ct-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 230deg at 30% 30%,#7bb0ff,#2d6cdf,#7bb0ff);color:#fff;font-weight:900;letter-spacing:.2px;box-shadow:inset 0 0 0 1px #dce7ff}
.ct-word{font:900 22px/1 Inter,system-ui;letter-spacing:-.4px}
.btn{height:40px;padding:0 14px;border-radius:14px;border:1px solid #dbe5ff;background:#fff;font-weight:700}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(45,108,223,.25)}
.container{max-width:1040px;margin:0 auto;padding:12px 16px 96px;display:grid;gap:14px}
.section{background:#fff;border:1px solid var(--hair);border-radius:22px;box-shadow:var(--shadow);padding:14px}
.section h1{margin:6px 8px 10px;font:800 28px/1.2 Inter,system-ui}
.card{border:1px solid #edf1f7;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .meta{color:var(--muted);font-size:14px}

/* Chips (категории) */
.ct-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 4px 2px}
.chip{border:1px solid #dbe5ff;background:#fff;padding:8px 12px;border-radius:999px;font-weight:700}
.chip.active{background:#eef3ff;color:var(--brand);border-color:#cfe0ff}

/* Модалка */
.ct-modal{position:fixed;inset:0;z-index:100;display:block}
.ct-modal .overlay{position:absolute;inset:0;background:rgba(0,0,0,.25)}
.ct-modal .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,720px);max-height:86vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px}
.ct-modal .hdr{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 8px}
.ct-modal .cnt{padding:6px}
.ct-modal .ftr{display:flex;justify-content:flex-end;gap:8px;padding:6px}
.icon-btn{border:0;background:#f1f5ff;border-radius:10px;width:32px;height:32px;font-weight:900}

/* Поля формы */
.fld{display:grid;gap:.35rem;margin:.5rem 0}
.fld label{font-weight:700}
input[type="text"], textarea, select{width:100%;height:44px;border-radius:12px;border:1px solid #dae2f3;padding:0 12px;background:#fff}
textarea{height:auto;min-height:100px;padding:10px}
.badge{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:10px;background:#eef3ff;color:var(--brand);font-weight:800;padding:0 10px}
</style>

<!-- Универсальные компоненты -->
<script>
/* ВСТАВЬ СЮДА содержимое ui/core.js из ответа выше (CT, CT.store, CT.ui...) */
</script>
</head>
<body>

<!-- AppBar -->
<header class="appbar">
  <div class="wrap">
    <div class="logo">
      <div class="ct-badge">CT</div>
      <div class="ct-word">CITI·TOOL</div>
    </div>
    <div class="actions">
      <button class="btn brand" id="btnNew">Neues Dokument</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="section">
    <h1>Dokumentation</h1>

    <!-- фильтр категорий -->
    <div id="catFilter"></div>

    <!-- список документов -->
    <div id="docList" class="list" style="display:grid;gap:10px;margin-top:8px"></div>
  </section>
</main>

<script>
/* ---------- РЕНДЕР ---------- */
const $list = document.getElementById('docList');

function render(cat='Alle'){
  const docs = CT.docs.all().filter(d => cat==='Alle' ? true : (d.category===cat));
  $list.innerHTML = '';
  if(!docs.length){
    $list.innerHTML = `<div class="card"><div>Keine Dokumente.</div><button class="btn brand" id="btnNewInline">Neu</button></div>`;
    document.getElementById('btnNewInline')?.addEventListener('click', openEditor);
    return;
  }
  docs.forEach(doc=>{
    const row = document.createElement('div');
    row.className = 'card';
    row.innerHTML = `
      <div>
        <div style="font-weight:800">${CT.escape(doc.title)}</div>
        <div class="meta">${CT.escape(doc.category||'Allgemein')}${doc.tags?.length? ' • '+doc.tags.join(', ') : ''}</div>
      </div>
      <div style="display:flex;gap:8px">
        <span class="badge">${doc.type || 'Notiz'}</span>
        <button class="btn">Bearbeiten</button>
      </div>`;
    // предпросмотр/редактирование
    row.querySelector('.btn').onclick = ()=> openEditor(doc);
    row.onclick = (e)=>{ if(e.target.tagName!=='BUTTON') openPreview(doc); };
    $list.appendChild(row);
  });
}

/* ---------- ФИЛЬТР ---------- */
CT.ui.categoryFilter({
  mount: document.getElementById('catFilter'),
  onSelect: (c)=> render(c)
});

/* ---------- ПРЕДПРОСМОТР ---------- */
function openPreview(doc){
  const body = document.createElement('div');
  body.innerHTML = `
    <div class="fld"><label>Kategorie</label><div>${CT.escape(doc.category||'Allgemein')}</div></div>
    ${doc.tags?.length? `<div class="fld"><label>Tags</label><div>${doc.tags.map(t=>`<span class="badge" style="margin-right:6px">${CT.escape(t)}</span>`).join('')}</div></div>`:''}
    ${doc.text ? `<div class="fld"><label>Inhalt</label><div style="white-space:pre-wrap">${CT.escape(doc.text)}</div></div>`:''}
    ${doc.link ? `<div class="fld"><label>Link</label><div><a href="${doc.link}" target="_blank">${doc.link}</a></div></div>`:''}
  `;
  const footer = document.createElement('div');
  const b1 = Object.assign(document.createElement('button'),{className:'btn',textContent:'Bearbeiten'});
  const b2 = Object.assign(document.createElement('button'),{className:'btn',textContent:'Löschen'});
  const b3 = Object.assign(document.createElement('button'),{className:'btn brand',textContent:'Schließen'});
  footer.append(b1,b2,b3);
  const modal = CT.ui.previewModal({title:doc.title, body, footer});
  b1.onclick = ()=>{ modal.remove(); openEditor(doc); };
  b2.onclick = ()=>{ if(confirm('Löschen?')){ CT.docs.remove(doc.id); modal.remove(); render(document.querySelector('.chip.active')?.textContent||'Alle'); } };
  b3.onclick = ()=> modal.remove();
}

/* ---------- РЕДАКТОР ---------- */
function openEditor(doc={}){
  // cats
  const cats = CT.cat.list();

  const body = document.createElement('div');
  body.innerHTML = `
    <div class="fld"><label>Titel</label><input type="text" id="f_title" value="${CT.escape(doc.title||'')}" placeholder="Aufspann-Check"></div>
    <div class="fld">
      <label>Kategorie</label>
      <div style="display:flex;gap:8px">
        <select id="f_cat" style="flex:1">
          ${cats.map(c=>`<option ${doc.category===c?'selected':''}>${CT.escape(c)}</option>`).join('')}
        </select>
        <button class="btn" id="f_cat_add">+ Neu</button>
      </div>
    </div>
    <div class="fld"><label>Tags (Komma)</label><input type="text" id="f_tags" value="${CT.escape((doc.tags||[]).join(', '))}" placeholder="ISO-P, Kühlung"></div>
    <div class="fld"><label>Link (optional)</label><input type="text" id="f_link" value="${CT.escape(doc.link||'')}" placeholder="https://…"></div>
    <div class="fld"><label>Text</label><textarea id="f_text" placeholder="Kurze Notiz…">${CT.escape(doc.text||'')}</textarea></div>
  `;

  const footer = document.createElement('div');
  const save = Object.assign(document.createElement('button'),{className:'btn brand',textContent:'Speichern'});
  const cancel = Object.assign(document.createElement('button'),{className:'btn',textContent:'Abbrechen'});
  footer.append(cancel,save);

  const modal = CT.ui.previewModal({title: doc.id?'Dokument bearbeiten':'Neues Dokument', body, footer});

  // + новая категория
  body.querySelector('#f_cat_add').onclick = ()=>{
    const name = prompt('Neue Kategorie:');
    if(!name) return;
    CT.cat.ensure(name);
    const sel = body.querySelector('#f_cat');
    sel.insertAdjacentHTML('beforeend', `<option selected>${CT.escape(name)}</option>`);
    sel.value = name;
  };

  cancel.onclick = ()=> modal.remove();

  save.onclick = ()=>{
    const dto = {
      id: doc.id,
      title: body.querySelector('#f_title').value.trim(),
      category: body.querySelector('#f_cat').value,
      tags: body.querySelector('#f_tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      link: body.querySelector('#f_link').value.trim(),
      text: body.querySelector('#f_text').value
    };
    if(!dto.title){ alert('Titel fehlt'); return; }
    CT.docs.upsert(dto);
    modal.remove();
    // перерисовать с учётом текущего фильтра
    const cur = document.querySelector('.chip.active')?.textContent || 'Alle';
    render(cur);
  };
}

/* Кнопка в AppBar */
document.getElementById('btnNew').addEventListener('click', ()=> openEditor({}));

/* ДЕМО при первом запуске */
if(!CT.docs.all().length){
  CT.docs.upsert({title:'Aufspann-Check', category:'Allgemein', tags:['check'], text:'Schrauben, Anschläge, Reitstock…', type:'Notiz'});
}

/* Стартовый рендер */
render('Alle');
</script>
</body>
</html>
