<!doctype html><html lang="de"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Docs • CitiTool</title>
<link rel="stylesheet" href="ui/core.css">
</head><body>
<div id="appbar"></div>
<main class="container">
  <section class="section">
    <h2>Dokumentation</h2>
    <div id="list" class="list"></div>
  </section>
</main>
<div id="dock"></div>
<script src="ui/core.js"></script>
<script>
CT.ui.mountAppBar('#appbar',{
  title:'CITI·TOOL',
  subtitle:'Dokumente',
  actions:[{id:'new',label:'Neues Dokument',type:'brand',onClick:()=>CT.ui.docEditor({})}],
  onSearch:q=>render(q)
});
CT.ui.mountDock('#dock',{active:'docs'});

function card(d){
  return `<div class="row">
    <div><div class="title">${d.title}</div>
      <div class="meta">${(d.cats||[]).join(' • ')}${d.tags?.length?' — '+d.tags.join(', '):''}</div>
    </div>
    <div>
      <button class="ct-btn" data-ed="${d.id}">Bearbeiten</button>
    </div>
  </div>`;
}
function render(q=''){
  const list = document.getElementById('list');
  const arr = CT.doc.search(q);
  list.innerHTML = arr.map(card).join('') || '<div class="muted">Keine Dokumente…</div>';
  list.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>CT.ui.docEditor({docId:b.dataset.ed}));
}
render();
CT.bus.on('docs:changed',()=>render(document.getElementById('ctSearchInput')?.value||''));
</script>
</body></html>
