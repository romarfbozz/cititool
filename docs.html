<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CITI·TOOL — Dokumente</title>
<link rel="stylesheet" href="./ui/core.css">
</head>
<body>
<header id="appbar" class="appbar"></header>

<main class="container mw">
  <section class="section">
    <h1>Dokumentation</h1>
    <div id="catFilter"></div>
    <div id="docsList" class="list"></div>
  </section>
</main>

<nav class="dock">
  <div class="wrap">
    <a href="./index.html"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg><small>Dash</small></a>
    <a href="./setup.html"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 10-7.08 7.06 7 7 0 007.08-7.06zM11 6h2v6h-2V6zm0 8h2v2h-2v-2z"/></svg><small>Setup</small></a>
    <a href="./tools.html"><svg viewBox="0 0 24 24"><path d="M22 19l-8-8 2-2 8 8-2 2zM14.3 7.7l-1-1L9 11v2h2l4.3-4.3zM7 2l3 3-2 2-3-3L7 2zM2 7l3 3-2 2-3-3L2 7zM3 14h6v8H3z"/></svg><small>Tools</small></a>
    <a href="./programme.html"><svg viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 4h12v2H3V8zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg><small>Programme</small></a>
    <a class="active" href="./docs.html"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5"/><path d="M8 13h8v2H8zM8 17h8v2H8z"/></svg><small>Docs</small></a>
  </div>
</nav>

<script src="./ui/core.js"></script>
<script>
/* --- AppBar --- */
CT.ui.appBar({
  subtitle:'Dokumente',
  actions:[
    {text:'Neues Dokument', kind:'brand', onClick:()=>openEditor()},
    {type:'search', placeholder:'Suchen…', onChange:q=>render({q})}
  ]
});

/* --- демо --- */
CT.demo.ensure();

/* --- локальный state --- */
let STATE = { q:null, cat:null };

/* --- фильтр категорий --- */
document.querySelector('#catFilter').appendChild(
  CT.ui.categoryFilter({
    scope:'docs',
    onChange:(cat)=>{ STATE.cat=cat; render(); }
  })
);

/* --- список --- */
function render({q}={}){
  if(q!==undefined) STATE.q=q;
  let items = STATE.q ? CT.docs.search(STATE.q) : CT.docs.all();
  if(STATE.cat) items = items.filter(x=>x.category===STATE.cat);
  CT.ui.list('#docsList', items, renderDoc);
}
function renderDoc(doc){
  const el = CT.el(`<div class="card">
      <div style="min-width:0">
        <div class="title">${doc.title||'—'}</div>
        <div class="muted" style="font-size:13px">${doc.category||'—'}${doc.tags?.length?' • '+doc.tags.join(', '):''}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn" data-act="open">Öffnen</button>
        <button class="btn" data-act="edit">Bearbeiten</button>
      </div>
    </div>`);
  el.querySelector('[data-act="open"]').onclick = ()=> openViewer(doc);
  el.querySelector('[data-act="edit"]').onclick = ()=> openEditor(doc);
  return el;
}

/* --- редактор (общий) --- */
const DOC_SCHEMA = [
  {key:'title', label:'Titel', type:'text', required:true, full:true},
  {key:'category', label:'Kategorie', type:'select:create', scope:'docs'},
  {key:'tags', label:'Tags', type:'chips'},
  {key:'type', label:'Typ', type:'seg', options:['PDF','DOC','PPT','Notiz']},
  {key:'text', label:'Inhalt', type:'textarea', rows:8, full:true},
  {key:'fileThumb', label:'Bild/Thumb', type:'file', accept:'image/*'}
];
function openEditor(doc){
  CT.ui.editor({
    title: doc?'Dokument bearbeiten':'Neues Dokument',
    schema: DOC_SCHEMA,
    value: doc||{},
    onSubmit:(val,modal)=>{
      if(!val.title?.trim()){ CT.ui.toast('Titel ist erforderlich'); return; }
      val.timestamp = Date.now();
      if(doc) val.id=doc.id;
      CT.docs.upsert(val);
      modal.remove();
      CT.ui.toast('Gespeichert');
      render();
    }
  });
}
function openViewer(doc){
  const box = CT.el(`<div></div>`);
  box.appendChild(CT.el(`<div class="muted">Kategorie: <b>${doc.category||'—'}</b>${doc.tags?.length?' • '+doc.tags.join(', '):''}</div>`));
  if(doc.fileThumb) box.appendChild(CT.el(`<div style="margin:8px 0"><img src="${doc.fileThumb}" style="max-width:100%;border-radius:12px"></div>`));
  if(doc.text) box.appendChild(CT.el(`<div class="section" style="border:1px dashed #e5eaf4">${doc.text.replace(/\n/g,'<br>')}</div>`));
  CT.ui.modal({title:doc.title, content:box});
}

render();
</script>
</body>
</html>
