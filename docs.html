<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CitiTool • Docs</title>
<link rel="stylesheet" href="./ui/neo.css">
</head>
<body>

<div class="hero-bg"><div class="hero-grid"></div></div>

<header class="appbar">
  <div class="wrap">
    <div class="logo-line">
      <div class="ct-badge">CT</div>
      <div class="ct-word"><b>CITI‧TOOL</b></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnNew">Neues Dokument</button>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.29l4.7 4.7 1.41-1.41-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
        <input type="search" placeholder="Suchen…" id="q" autocomplete="off">
      </div>
    </div>
  </div>
</header>

<main class="main">

  <section class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px">
      <h2 style="margin:0">Letzter Artikel</h2>
      <button class="btn btn--outline is-sm" id="btnCats">Kategorien…</button>
    </div>
    <div class="list" id="latestWrap"></div>
  </section>

  <section class="section">
    <h2>Dokumente</h2>
    <div class="list" id="docList"></div>
  </section>

</main>

<nav class="dock">
  <div class="wrap">
    <a href="./index.html" data-id="dash"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg><small>Dash</small></a>
    <a href="./setup.html" data-id="setup"><svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 10-7.08 7.06 7 7 0 007.08-7.06zM11 6h2v6h-2V6zm0 8h2v2h-2v-2z"/></svg><small>Setup</small></a>
    <a href="./tools.html" data-id="tools"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19l-8-8 2-2 8 8-2 2zM14.3 7.7l-1-1L9 11v2h2l4.3-4.3zM7 2l3 3-2 2-3-3L7 2zM2 7l3 3-2 2-3-3L2 7zM3 14h6v8H3z"/></svg><small>Tools</small></a>
    <a href="./setup.html" data-id="programs"><svg class="icon" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 4h12v2H3V8zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg><small>Programme</small></a>
    <a href="./docs.html" data-id="docs" class="active"><svg class="icon" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5"/><path d="M8 13h8v2H8zM8 17h8v2H8z"/></svg><small>Docs</small></a>
  </div>
</nav>

<script src="./ui/neo.js"></script>
<script src="./ui/docs.js"></script>
<script>
CT.neo.wireSearch(document.getElementById('searchBox'), document.getElementById('q'));
CT.neo.shrinkOnScroll();
CT.neo.setActiveDock('docs');

Docs.ensureSeeds();

const state = { q:'' };
CT.on('search', q=>{ state.q=q||''; renderList(); });

const listEl = document.getElementById('docList');
const latestWrap = document.getElementById('latestWrap');

/* -------- Viewer (i) -------- */
function openViewer(d){
  const box = document.createElement('div');

  const top = document.createElement('div');
  if (d.imgData){
    const img = document.createElement('img');
    img.src = d.imgData; img.alt = 'Bild'; img.style.width='100%'; img.style.borderRadius='12px';
    top.append(img);
  } else {
    const ph = document.createElement('div');
    ph.style.height='160px'; ph.style.border='1px solid #edf1f7'; ph.style.borderRadius='12px';
    ph.style.display='grid'; ph.style.placeItems='center'; ph.style.color='#6b7a90'; ph.style.fontWeight='800';
    ph.textContent = 'kein Foto';
    top.append(ph);
  }

  const h = document.createElement('h3'); h.textContent = d.title; h.style.margin='12px 0 6px';
  const meta = document.createElement('div'); meta.className='meta';
  meta.textContent = `${d.category} • ${new Date(Number(d.updatedAt||d.createdAt)).toLocaleString()}`;

  const body = document.createElement('div');
  const p = document.createElement('p'); p.textContent = d.text || '';
  body.append(p);

  if (d.file){
    const fi = document.createElement('div'); fi.className='meta';
    fi.textContent = `Datei: ${d.file.name} (${d.file.type||'—'})`;
    body.append(fi);
  }

  const tagsWrap = document.createElement('div');
  tagsWrap.style.display='flex'; tagsWrap.style.flexWrap='wrap'; tagsWrap.style.gap='6px'; tagsWrap.style.marginTop='8px';
  (d.tags||[]).forEach(t=>{
    const tag = document.createElement('span'); tag.className='tag tag--sm'; tag.textContent = t;
    tagsWrap.append(tag);
  });

  box.append(top, h, meta, body, tagsWrap);

  CT.ui.modal.open({
    title:'Dokument',
    contentEl: box,
    footer: [
      {label:'Löschen', kind:'danger', onClick: ()=>{
        CT.ui.confirm({title:'Löschen?', msg:`«${d.title}» wirklich entfernen?`}).then(ok=>{
          if(ok){ Docs.remove(d.id); CT.ui.modal.close(); render(); }
        });
      }},
      {label:'Bearbeiten', onClick: ()=>{ CT.ui.modal.close(); openEditor(d); }},
      {label:'Schließen', onClick: ()=> CT.ui.modal.close()}
    ],
    wide:true
  });
}

/* -------- Editor (добавлено удаление фото) -------- */
function openEditor(doc){
  const cats = Docs.loadCats();
  if (doc && doc.category && !cats.includes(doc.category)) cats.push(doc.category);

  const initial = doc
    ? { title:doc.title, category:doc.category||cats[0]||'Allgemein', tags:(doc.tags||[]).join(', '), text:doc.text||'' }
    : { title:'', category:cats[0]||'Allgemein', tags:'', text:'' };

  let removePhoto = false; // <- флаг «удалить фото»

  const form = CT.ui.form.create({
    values: initial,
    fields: [
      {type:'text',   key:'title',    label:'Titel', placeholder:'...'},
      {type:'select', key:'category', label:'Kategorie', options: cats},
      {type:'text',   key:'tags',     label:'Tags (comma)', placeholder:'drehen, stahl'},
      {type:'textarea', key:'text',   label:'Text', rows:4},
      {type:'file',   key:'file',     label:'Datei/Foto', accept:'.pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg'}
    ]
  });

  // превью текущего фото + кнопка «удалить»
  const preview = document.createElement('div');
  preview.style.display='flex'; preview.style.alignItems='center'; preview.style.gap='10px';
  preview.style.margin='0 0 10px 0';

  if (doc && doc.imgData){
    const img = document.createElement('img');
    img.src = doc.imgData; img.alt = 'thumb'; img.width = 64; img.height = 64; img.style.borderRadius='10px';
    const del = document.createElement('button');
    del.className = 'btn btn--outline is-sm';
    del.textContent = 'Foto entfernen';
    del.onclick = ()=> {
      removePhoto = true;
      preview.innerHTML = '<div class="meta">Foto wird entfernt</div>';
    };
    preview.append(img, del);
  } else {
    // ничего не показываем — удалять нечего
  }

  // если пользователь выбирает новый файл-изображение — отменяем "removePhoto"
  const fileInput = form.el.querySelector('input[type=file]');
  fileInput.addEventListener('change', ()=>{ removePhoto = false; });

  // + Neue Kategorie
  const tools = document.createElement('div');
  tools.style.display='flex'; tools.style.justifyContent='space-between'; tools.style.margin='0 0 8px';
  const btnNewCat = document.createElement('button'); btnNewCat.className='btn btn--outline is-sm'; btnNewCat.textContent='+ Neue Kategorie';
  btnNewCat.onclick = ()=>{
    const catForm = CT.ui.form.create({ values:{name:''}, fields:[{type:'text', key:'name', label:'Name'}] });
    CT.ui.modal.open({
      title:'Kategorie hinzufügen',
      contentEl:catForm.el,
      footer:[
        {label:'Abbrechen', onClick:()=>CT.ui.modal.close()},
        {label:'Hinzufügen', kind:'primary', onClick:()=>{
          const v=catForm.getValues(); const name=(v.name||'').trim(); if(!name){catForm.setErrors({name:'Pflichtfeld'});return;}
          Docs.cats.add(name); CT.ui.modal.close(); CT.ui.modal.close(); openEditor(doc);
        }}
      ]
    });
  };
  tools.append(document.createTextNode(''), btnNewCat);

  const holder = document.createElement('div');
  if (preview.childNodes.length) holder.append(preview);
  holder.append(tools, form.el);

  CT.ui.modal.open({
    title: doc? 'Dokument bearbeiten' : 'Neues Dokument',
    contentEl: holder,
    footer: [
      {label:'Abbrechen', onClick:()=>CT.ui.modal.close()},
      {label:'Speichern', kind:'primary', onClick: async ()=>{
        const v = form.getValues();
        if (!v.title || !v.title.trim()){ form.setErrors({title:'Pflichtfeld'}); return; }

        const patch = {
          title: v.title.trim(),
          category: (v.category||'Allgemein').trim(),
          tags: v.tags ? v.tags.split(',').map(s=>s.trim()).filter(Boolean) : [],
          text: v.text||'',
        };

        const fileEl = form.el.querySelector('input[type=file]');
        if (fileEl && fileEl.files && fileEl.files[0]){
          const f = fileEl.files[0];
          const isImg = /^image\//.test(f.type);
          let imgData = null;
          if (isImg) imgData = await Docs.resizeImageToDataURL(f, 512);
          patch.file = { name:f.name, type:f.type };
          patch.imgData = imgData; // заменить/добавить превью
        } else if (removePhoto) {
          patch.imgData = null; // удалить текущее фото
        }
        if (doc){ Docs.update(doc.id, patch); }
        else { Docs.create(patch); }
        CT.ui.modal.close(); render();
      }}
    ],
    wide:true
  });
}

/* -------- List / Latest etc. (без изменений) -------- */
function renderLatest(){
  latestWrap.innerHTML='';
  const all = Docs.list({});
  if (all.length===0){
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div'); left.innerHTML='<div class="title">Noch nichts hinzugefügt</div><div class="meta">Erstelle dein erstes Dokument</div>';
    const right=document.createElement('div');
    const btn=document.createElement('button'); btn.className='btn btn--outline is-sm'; btn.textContent='Neues Dokument';
    btn.onclick=()=>openEditor();
    right.append(btn); row.append(left,right); latestWrap.append(row);
    return;
  }
  const d = all[0];
  const row=document.createElement('div'); row.className='row';

  const left=document.createElement('div');
  const grid=document.createElement('div'); grid.style.display='grid'; grid.style.gridTemplateColumns='56px auto'; grid.style.gap='10px';
  const thumb=document.createElement('div');
  thumb.style.width='56px'; thumb.style.height='56px'; thumb.style.border='1px solid #edf1f7'; thumb.style.borderRadius='10px';
  thumb.style.display='grid'; thumb.style.placeItems='center'; thumb.style.color='#6b7a90'; thumb.style.fontWeight='800';
  if (d.imgData){ const img=document.createElement('img'); img.src=d.imgData; img.alt='thumb'; img.width=56; img.height=56; img.style.borderRadius='10px'; thumb.innerHTML=''; thumb.append(img); }
  else { thumb.textContent='CT'; }

  const tw=document.createElement('div');
  const title=document.createElement('div'); title.className='title'; title.textContent=d.title;
  const meta=document.createElement('div'); meta.className='meta'; meta.textContent=`${d.category} • ${new Date(Number(d.updatedAt||d.createdAt)).toLocaleString()}`;
  const txt=document.createElement('div'); txt.className='meta'; txt.textContent=Docs.truncate(d.text,120);
  tw.append(title,meta,txt);

  grid.append(thumb,tw); left.append(grid);

  const right=document.createElement('div'); right.style.display='flex'; right.style.gap='6px';
  const bInfo=document.createElement('button'); bInfo.className='btn btn--outline is-sm'; bInfo.textContent='i';
  bInfo.onclick=()=>openViewer(d);
  right.append(bInfo);

  row.append(left,right);
  latestWrap.append(row);
}

function renderList(){
  listEl.innerHTML='';
  const arr = Docs.list({q:state.q});
  if (arr.length===0){
    const empty=document.createElement('div'); empty.className='row';
    empty.innerHTML = `<div class="muted">Keine Dokumente</div>`;
    listEl.append(empty);
    return;
  }
  arr.forEach(d=>{
    const row=document.createElement('div'); row.className='row';

    const left = document.createElement('div');
    const grid = document.createElement('div'); grid.style.display='grid'; grid.style.gridTemplateColumns='56px auto'; grid.style.gap='10px';

    const thumb=document.createElement('div');
    thumb.style.width='56px'; thumb.style.height='56px'; thumb.style.border='1px solid #edf1f7'; thumb.style.borderRadius='10px';
    thumb.style.display='grid'; thumb.style.placeItems='center'; thumb.style.color='#6b7a90'; thumb.style.fontWeight='800';
    if (d.imgData){ const img=document.createElement('img'); img.src=d.imgData; img.alt='thumb'; img.width=56; img.height=56; img.style.borderRadius='10px'; thumb.innerHTML=''; thumb.append(img); }
    else { thumb.textContent='CT'; }

    const tw=document.createElement('div');
    const title=document.createElement('div'); title.className='title'; title.textContent=d.title;
    const meta=document.createElement('div'); meta.className='meta'; meta.textContent=`${d.category} • ${new Date(Number(d.updatedAt||d.createdAt)).toLocaleString()}`;
    const txt=document.createElement('div'); txt.className='meta'; txt.textContent=Docs.truncate(d.text,120);
    tw.append(title,meta,txt);

    grid.append(thumb,tw); left.append(grid);

    const right=document.createElement('div'); right.style.display='flex'; right.style.gap='6px';
    const bInfo=document.createElement('button'); bInfo.className='btn btn--outline is-sm'; bInfo.textContent='i';
    bInfo.onclick=()=>openViewer(d);
    right.append(bInfo);

    row.append(left,right);
    listEl.append(row);
  });
}

function render(){
  renderLatest();
  renderList();
}

/* --- Категории --- */
document.getElementById('btnCats').onclick = ()=>{
  const cats = Docs.loadCats();
  const box = document.createElement('div');
  const list = document.createElement('div');

  function refreshList(){
    list.innerHTML='';
    cats.splice(0, cats.length, ...Docs.loadCats());
    cats.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const left=document.createElement('div'); left.innerHTML=`<div class="title">${c}</div>`;
      const right=document.createElement('div'); right.style.display='flex'; right.style.gap='6px';
      const bRen=document.createElement('button'); bRen.className='btn btn--outline is-sm'; bRen.textContent='Umbenennen';
      const bDel=document.createElement('button'); bDel.className='btn btn--outline is-sm'; bDel.textContent='Löschen';
      bRen.onclick=()=>{
        const f=CT.ui.form.create({values:{to:c},fields:[{type:'text',key:'to',label:'Neuer Name',placeholder:c}]});
        CT.ui.modal.open({
          title:`Kategorie «${c}» umbenennen`,
          contentEl:f.el,
          footer:[
            {label:'Abbrechen',onClick:()=>CT.ui.modal.close()},
            {label:'Speichern',kind:'primary',onClick:()=>{
              const v=f.getValues(); const to=(v.to||'').trim(); if(!to){f.setErrors({to:'Pflichtfeld'});return;}
              Docs.cats.rename(c,to); CT.ui.modal.close(); document.getElementById('btnCats').click();
            }}
          ]
        });
      };
      bDel.onclick=()=>{
        const f=CT.ui.form.create({
          values:{reassign:'Allgemein'},
          fields:[{type:'select',key:'reassign',label:'Dokumente zu',options:Docs.loadCats()}]
        });
        CT.ui.modal.open({
          title:`Kategorie «${c}» löschen`,
          contentEl:f.el,
          footer:[
            {label:'Abbrechen',onClick:()=>CT.ui.modal.close()},
            {label:'Löschen',kind:'danger',onClick:()=>{
              const v=f.getValues(); Docs.cats.remove(c, v.reassign||'Allgemein'); CT.ui.modal.close(); document.getElementById('btnCats').click();
            }}
          ]
        });
      };
      right.append(bRen,bDel); row.append(left,right); list.append(row);
    });
  }

  const addBar=document.createElement('div'); addBar.className='row';
  const addBtn=document.createElement('button'); addBtn.className='btn'; addBtn.textContent='+ Hinzufügen';
  addBtn.onclick=()=>{
    const f=CT.ui.form.create({values:{name:''},fields:[{type:'text',key:'name',label:'Name'}]});
    CT.ui.modal.open({
      title:'Neue Kategorie',
      contentEl:f.el,
      footer:[
        {label:'Abbrechen',onClick:()=>CT.ui.modal.close()},
        {label:'Hinzufügen',kind:'primary',onClick:()=>{
          const v=f.getValues(); const name=(v.name||'').trim(); if(!name){f.setErrors({name:'Pflichtfeld'});return;}
          Docs.cats.add(name); CT.ui.modal.close(); refreshList();
        }}
      ]
    });
  };
  addBar.append(document.createElement('div'), addBtn);

  box.append(addBar, list);
  refreshList();

  CT.ui.modal.open({
    title:'Kategorien',
    contentEl:box,
    footer:[{label:'Schließen',onClick:()=>CT.ui.modal.close()}],
    wide:true
  });
};

document.getElementById('btnNew').onclick = ()=> openEditor();

CT.on('search', q=>{ state.q=q||''; renderList(); });

render();
</script>
</body>
</html>
