<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CITI·TOOL — Dokumente</title>
<style>
:root{--bg:#f6f8fb;--ink:#0d1b2a;--muted:#6b7a90;--brand:#2d6cdf;--hair:#e9eef6;--shadow:0 10px 30px rgba(13,27,42,.08)}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,system-ui,sans-serif}
.mw{max-width:1040px;margin:0 auto}

/* AppBar */
.appbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.75));border-bottom:1px solid var(--hair);backdrop-filter:saturate(1.1) blur(8px)}
.appbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.brandline{display:flex;align-items:center;gap:10px}
.ct-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:.2px;box-shadow:inset 0 0 0 1px #dce7ff;background:conic-gradient(from 230deg at 30% 30%, #7bb0ff, #2d6cdf, #7bb0ff)}
.ct-word{font:900 22px/1 Inter,system-ui;letter-spacing:-.3px}
.actions{display:flex;align-items:center;gap:8px}
.btn{height:40px;padding:0 14px;border-radius:14px;border:1px solid #dbe5ff;background:#fff;font-weight:700}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(45,108,223,.25)}
.btn:active{transform:translateY(1px)}
.search{position:relative;display:flex;align-items:center;overflow:hidden;width:44px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--hair);box-shadow:inset 0 1px 2px rgba(0,0,0,.04);transition:width .3s}
.search.active{width:min(56vw,260px)}
.search svg{position:absolute;left:12px;width:18px;height:18px;fill:#8aa0c4}
.search input{border:0;outline:0;width:100%;height:100%;padding:0 12px 0 38px;background:transparent;font:600 14px/1.2 Inter,system-ui;color:var(--ink)}

/* content */
.container{padding:14px 16px 96px}
.section{background:#fff;border:1px solid #edf1f7;border-radius:22px;box-shadow:var(--shadow);padding:16px;margin:8px 0}
.section h1{margin:2px 4px 12px;font:800 28px/1.2 Inter,system-ui}
.list{display:grid;gap:10px}
.card{border:1px solid #edf1f7;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff}
.card .title{font-weight:800}
.feature{background:#f7faff;border-color:#deeaFF}
.thumb{width:72px;height:72px;border-radius:12px;background:#f0f3fa;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.noimg{display:grid;place-items:center;gap:6px}
.noimg-badge{width:40px;height:40px;border-radius:12px;background:#eef3ff;display:grid;place-items:center;color:#89a7e6;font-weight:800}
.muted{color:var(--muted)}
.badge{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:10px;background:#eef3ff;color:var(--brand);font-weight:800;padding:0 10px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.show{display:block}
.modal .overlay{position:absolute;inset:0;background:rgba(0,0,0,.25)}
.modal .sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,760px);max-height:86vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px}
.modal .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.fld{display:grid;gap:.35rem}
.fld input,.fld select,.fld textarea{width:100%;height:42px;border-radius:12px;border:1px solid #dae2f3;padding:0 12px;background:#fff}
.fld textarea{height:auto;min-height:120px;padding:10px}
.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left);backdrop-filter:blur(12px) saturate(1.2);background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.85));border-top:1px solid var(--hair)}
.dock .wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.dock a{display:grid;justify-items:center;gap:4px;padding:10px;border-radius:14px;text-decoration:none;color:inherit}
.dock a small{font-weight:600;font-size:12px;color:#344966}
.dock a.active{background:#eef3ff;box-shadow:inset 0 0 0 1px #d6e5ff}
.dock svg{width:22px;height:22px;fill:#2e3e55}
</style>
</head>
<body>

<!-- AppBar -->
<header class="appbar" id="appbar"></header>

<main class="container mw">
  <section class="section">
    <h1>Dokumentation</h1>
    <!-- верхняя карточка – всегда последний добавленный -->
    <div id="latest" class="list"></div>
    <!-- остальные -->
    <div id="docsList" class="list"></div>
  </section>
</main>

<!-- Dock -->
<nav class="dock">
  <div class="wrap">
    <a href="./index.html"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg><small>Dash</small></a>
    <a href="./setup.html"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 10-7.08 7.06 7 7 0 007.08-7.06zM11 6h2v6h-2V6zm0 8h2v2h-2v-2z"/></svg><small>Setup</small></a>
    <a href="./tools.html"><svg viewBox="0 0 24 24"><path d="M22 19l-8-8 2-2 8 8-2 2zM14.3 7.7l-1-1L9 11v2h2l4.3-4.3zM7 2l3 3-2 2-3-3L7 2zM2 7l3 3-2 2-3-3L2 7zM3 14h6v8H3z"/></svg><small>Tools</small></a>
    <a href="./programme.html"><svg viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 4h12v2H3V8zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg><small>Programme</small></a>
    <a class="active" href="./docs.html"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5"/><path d="M8 13h8v2H8zM8 17h8v2H8z"/></svg><small>Docs</small></a>
  </div>
</nav>

<script>
/* ========= Мини-ядро (автономно) ========= */
const CT={_k:'CT_V1'};
CT.store={
  get(k,fb){try{const all=JSON.parse(localStorage.getItem(CT._k)||'{}');return (k?all[k]:all)??fb}catch(e){return fb}},
  set(k,v){const all=CT.store.get();all[k]=v;localStorage.setItem(CT._k,JSON.stringify(all));return v}
};
CT.uuid=()=>('id-'+Math.random().toString(36).slice(2)+Date.now().toString(36));
CT.docs={
  all(){return CT.store.get('coll_docs',[])},
  save(list){return CT.store.set('coll_docs',list)},
  upsert(doc){const a=this.all(); if(!doc.id) doc.id=CT.uuid(); if(!doc.timestamp) doc.timestamp=Date.now();
    const i=a.findIndex(x=>x.id===doc.id); if(i>=0) a[i]=doc; else a.push(doc); this.save(a); return doc;}
};

/* ========= AppBar + поиск ========= */
function mountAppBar(){
  const el=document.getElementById('appbar');
  el.innerHTML=`<div class="row mw">
    <div class="brandline"><div class="ct-badge">CT</div>
      <div><div class="ct-word">CITI·TOOL</div><div class="muted" style="font-size:12px">Dokumente</div></div>
    </div>
    <div class="actions">
      <button class="btn brand" id="btnNew">Neues Dokument</button>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.29l4.7 4.7 1.41-1.41-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
        <input id="q" placeholder="Suchen…">
      </div>
    </div></div>`;
  const box=document.getElementById('searchBox'), q=document.getElementById('q');
  box.addEventListener('click',()=>{box.classList.add('active');q.focus()});
  q.addEventListener('blur',()=>{if(!q.value)box.classList.remove('active')});
  q.addEventListener('input',()=>render(q.value.trim().toLowerCase()));
  document.getElementById('btnNew').onclick=()=>openEditor();
}

/* ========= Modal helpers ========= */
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function showModal(title,body,footer){
  const m=h(`<div class="modal show"><div class="overlay"></div>
    <div class="sheet"><div class="hdr"><strong>${title}</strong><button class="btn" id="mClose">Schließen</button></div>
    <div class="body"></div><div class="footer"></div></div></div>`);
  m.querySelector('.body').append(body);
  footer && m.querySelector('.footer').append(footer);
  document.body.appendChild(m);
  m.querySelector('#mClose').onclick=()=>m.remove();
  m.querySelector('.overlay').onclick=()=>m.remove();
  return m;
}

/* ========= Editor ========= */
function openEditor(doc){
  const v=doc||{title:'',category:'',tags:[],type:'Notiz',text:'',fileThumb:''};
  const form=h(`<form class="grid">
    <div class="fld full"><label>Titel</label><input id="f_title" required value="${v.title||''}"></div>
    <div class="fld"><label>Kategorie</label><input id="f_cat" value="${v.category||''}" placeholder="Allgemein"></div>
    <div class="fld"><label>Tags (kommagetrennt)</label><input id="f_tags" value="${(v.tags||[]).join(', ')}"></div>
    <div class="fld"><label>Typ</label><input id="f_type" value="${v.type||''}"></div>
    <div class="fld full"><label>Inhalt</label><textarea id="f_text" rows="8">${v.text||''}</textarea></div>
    <div class="fld full"><label>Bild/Thumb</label><input id="f_file" type="file" accept="image/*"></div>
  </form>`);
  const bar=h(`<div class="footer">
    <button class="btn" id="cancel">Abbrechen</button>
    <button class="btn brand" id="save">Speichern</button></div>`);
  const m=showModal(doc?'Dokument bearbeiten':'Neues Dokument',form,bar);
  bar.querySelector('#cancel').onclick=()=>m.remove();
  bar.querySelector('#save').onclick=async ()=>{
    const out={...v};
    out.title=form.querySelector('#f_title').value.trim();
    if(!out.title){alert('Titel ist erforderlich');return;}
    out.category=form.querySelector('#f_cat').value.trim();
    out.tags=form.querySelector('#f_tags').value.split(',').map(s=>s.trim()).filter(Boolean);
    out.type=form.querySelector('#f_type').value.trim();
    out.text=form.querySelector('#f_text').value;
    const file=form.querySelector('#f_file').files[0];
    if(file){out.fileThumb=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file);});}
    out.timestamp=Date.now();
    if(doc&&doc.id) out.id=doc.id;
    CT.docs.upsert(out);
    m.remove();
    render();
  };
}

/* ========= Viewer ========= */
function thumb(doc){
  if(doc.fileThumb) return h(`<div class="thumb"><img src="${doc.fileThumb}" alt=""></div>`);
  return h(`<div class="thumb noimg">
    <div class="noimg-badge">CT</div><div class="muted" style="font-size:12px">kein Foto</div></div>`);
}
function openViewer(doc){
  const box=h(`<div></div>`);
  box.append(thumb(doc));
  box.append(h(`<div class="muted" style="margin:8px 0">Kategorie: <b>${doc.category||'—'}</b> ${doc.tags?.length?'• '+doc.tags.join(', '):''}</div>`));
  if(doc.text) box.append(h(`<div style="white-space:pre-wrap;border:1px dashed #e5eaf4;border-radius:12px;padding:10px">${doc.text}</div>`));
  showModal(doc.title,box);
}

/* ========= Render ========= */
function render(q){
  // сидаем демо один раз
  if(CT.docs.all().length===0){
    CT.docs.upsert({title:'Aufspann-Check',category:'Allgemein',tags:['check','setup'],type:'Notiz',text:'Schrauben, Anschläge, Reitstock…',timestamp:Date.now()});
  }
  let items=CT.docs.all().slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  if(q) items=items.filter(d=>(`${d.title} ${d.text} ${(d.tags||[]).join(' ')} ${d.category||''}`.toLowerCase().includes(q)));
  const latest=document.getElementById('latest'), list=document.getElementById('docsList');
  latest.innerHTML=''; list.innerHTML='';
  if(items.length){
    latest.append(renderCard(items[0],true));
    items.slice(1).forEach(d=>list.append(renderCard(d,false)));
  }
}
function renderCard(doc,featured){
  const el=h(`<div class="card ${featured?'feature':''}">
    <div style="display:flex;gap:12px;align-items:center;min-width:0">
      ${thumb(doc).outerHTML}
      <div style="min-width:0">
        <div class="title">${featured?'Neu • ':''}${doc.title||'—'}</div>
        <div class="muted" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${(doc.category||'—')}${doc.tags?.length?' • '+doc.tags.join(', '):''}
        </div>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn" data-a="open">Öffnen</button>
      <button class="btn" data-a="edit">Bearbeiten</button>
    </div>
  </div>`);
  el.querySelector('[data-a="open"]').onclick=()=>openViewer(doc);
  el.querySelector('[data-a="edit"]').onclick=()=>openEditor(doc);
  return el;
}

/* ========= Boot ========= */
mountAppBar();
render();
</script>
</body>
</html>
