<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CitiTool • Setup</title>
<link rel="stylesheet" href="./ui/neo.css?v=20251109">
<style>
.grid-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{border:1px solid #edf1f7;border-radius:16px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.slot .ph{height:84px;background:#f5f8ff;display:grid;place-items:center;border-bottom:1px solid #edf1f7}
.slot .ph img{max-width:100%;max-height:84px;object-fit:cover}
.slot .meta{padding:10px}
.slot .meta .t{font-weight:800}
.slot .meta .n{color:#6b7a90;font-size:13px}
.ro-ru{display:flex;gap:8px;margin:4px 0 12px}
.ro-ru .tab{padding:8px 12px;border:1px solid #dbe5ff;background:#fff;border-radius:12px;font-weight:800;cursor:pointer}
.ro-ru .tab.active{background:#eef3ff;box-shadow:inset 0 0 0 1px #d6e5ff}
.badge-live{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:10px;background:#eef3ff;color:#2d6cdf;font-weight:800;padding:0 10px}
.hero-mini{display:grid;gap:10px}
.kp{display:flex;align-items:center;gap:10px}
.kp img{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid #edf1f7;background:#fff}
.kp .txt{display:grid}
.kp .txt .t{font-weight:800}
.kp .txt .m{color:#6b7a90;font-size:13px}
.empty{padding:12px;border:1px dashed #dbe5ff;border-radius:14px;background:#fff}
.diag{margin-top:10px;padding:10px;border-radius:12px;border:1px solid #ffe6a8;background:#fff8e1;color:#7a5a00;font:12px/1.4 system-ui}
@media (max-width:560px){ .grid-slots{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>

<div class="hero-bg"><div class="hero-grid"></div></div>

<header class="appbar">
  <div class="wrap">
    <div class="logo-line">
      <div class="ct-badge">CT</div>
      <div class="ct-word"><b>CITI‧TOOL</b></div>
    </div>
    <div class="actions">
      <button class="btn brand" id="btnNewProg">Neues Programm</button>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.29l4.7 4.7 1.41-1.41-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
        <input type="search" placeholder="Suchen…" id="q" autocomplete="off">
      </div>
    </div>
  </div>
</header>

<main class="main">

  <section class="section">
    <h2>Zuletzt hinzugefügt</h2>
    <div class="hero-mini" id="lastWrap"></div>
  </section>

  <section class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px">
      <h2 style="margin:0">Programme</h2>
      <div class="chips" id="chipsSides">
        <button class="btn btn--outline is-sm active" data-side="">Alle</button>
        <button class="btn btn--outline is-sm" data-side="RO">RO</button>
        <button class="btn btn--outline is-sm" data-side="RU">RU</button>
      </div>
    </div>
    <div class="list" id="listWrap"></div>
    <div id="diag" class="diag" style="display:none"></div>
  </section>

</main>

<nav class="dock">
  <div class="wrap">
    <a href="./index.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg><small>Dash</small></a>
    <a href="./setup.html" class="active"><svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 10-7.08 7.06 7 7 0 007.08-7.06zM11 6h2v6h-2V6zm0 8h2v2H2V14z"/></svg><small>Setup</small></a>
    <a href="./tools.html"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19l-8-8 2-2 8 8-2 2zM14.3 7.7l-1-1L9 11v2h2l4.3-4.3zM7 2l3 3-2 2-3-3L7 2zM2 7l3 3-2 2-3-3L2 7zM3 14h6v8H3z"/></svg><small>Tools</small></a>
    <a href="./setup.html"><svg class="icon" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 4h12v2H3V8zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg><small>Programme</small></a>
    <a href="./docs.html"><svg class="icon" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5"/><path d="M8 13h8v2H8zM8 17h8v2H8z"/></svg><small>Docs</small></a>
  </div>
</nav>

<script src="./ui/neo.js?v=20251109" defer></script>
<script src="./ui/docs.js?v=20251109" defer></script>
<script src="./ui/setup.js?v=20251109" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', ()=>{
  CT.neo.wireSearch(document.getElementById('searchBox'), document.getElementById('q'));
  CT.neo.shrinkOnScroll();
  CT.neo.setActiveDock('setup');

  // жёсткий запуск + диагностика
  try { if (window.Setup?.ensureSeeds) Setup.ensureSeeds(); } catch(e){ console.error(e); }

  if (window.SetupUI?.mount) {
    SetupUI.mount({
      qInput: document.getElementById('q'),
      listWrap: document.getElementById('listWrap'),
      lastWrap: document.getElementById('lastWrap'),
      chipsSides: document.getElementById('chipsSides'),
      newBtn: document.getElementById('btnNewProg')
    });
  } else {
    const d=document.getElementById('diag');
    d.style.display='block';
    d.textContent='SetupUI не загрузился. Скрипт кэшируется. Обновил URL с версией — перезагрузка страницы подтянет новый JS.';
  }
});
</script>
</body>
</html>
