<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CitiTool • Setup</title>
  <link rel="stylesheet" href="./ui/core.css">
</head>
<body data-active="setup">

<!-- AppBar (Neo) -->
<header class="appbar">
  <div class="wrap">
    <a class="ct-logo" href="./index.html">
      <span class="mark" aria-hidden="true">CT</span>
      <span class="tit"><b>CitiTool</b><small>Setup</small></span>
    </a>
    <div class="actions">
      <button class="btn brand sm" id="btnNewProg">Neues Programm</button>
      <button class="icon-btn" data-ct="search-toggle" aria-label="Suchen">
        <svg><use href="./ui/icons.svg#search"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="searchbar collapsed">
  <input class="field" id="q" type="search" placeholder="Suche im Setup…">
</div>

<main class="container">
  <!-- Карточка программы -->
  <section class="section" id="progCard">
    <div class="row between" style="align-items:flex-start; gap:1rem">
      <div style="flex:1 1 auto; min-width:0">
        <h2 id="pTitle" style="margin:0 0 6px">Programm wählen…</h2>
        <div class="muted" id="pMeta">Nr — • Seite —</div>
      </div>
      <div class="imgwrap" style="width:140px; min-width:140px; aspect-ratio:1/1; border:1px dashed #e0eafc; border-radius:16px; overflow:hidden">
        <img id="pImg" alt="kein Foto" style="display:none">
        <div id="pNo" class="badge" style="height:100%; width:100%; border-radius:16px; background:#f5f8ff; display:grid; place-items:center">kein Foto</div>
      </div>
    </div>

    <div class="row" style="margin-top:12px; gap:.5rem; flex-wrap:wrap">
      <button class="btn sm" id="btnRO">RO (G54)</button>
      <button class="btn sm" id="btnRU">RU (G55)</button>
      <button class="btn brand" id="btnApply">In Live anwenden</button>
      <button class="btn ghost" id="btnEditProg">Bearbeiten</button>
    </div>
  </section>

  <!-- Слоты -->
  <section class="section">
    <h2>Setup (Live)</h2>
    <div id="slots" class="stack"></div>
  </section>
</main>

<nav class="dock" id="dock"></nav>

<script src="./ui/core.js"></script>
<script src="./ui/dock.js"></script>
<script>
CT.ready(()=>{
  CT.ensureSeeds?.();
  // безопасные ключи
  const K = (window.CT_KEYS||{});
  const KEY_PROGS = K.PROGS || 'CT_PROGS';
  const KEY_TOOLS = K.TOOLS || 'CT_TOOLS';

  // состояние страницы
  let side = 'RO';                // RO / RU
  let cur = CT.storage.read(KEY_PROGS, [])[0] || null;   // активная программа

  // элементы
  const elTitle = document.getElementById('pTitle');
  const elMeta  = document.getElementById('pMeta');
  const elImg   = document.getElementById('pImg');
  const elNo    = document.getElementById('pNo');
  const slotsEl = document.getElementById('slots');

  // helpers
  function progMeta(p){ return `Nr ${p.nr||'—'} • Seite ${side} (${side==='RO'?'G54':'G55'})`; }
  function readProgs(){ return CT.storage.read(KEY_PROGS, []); }
  function writeProgs(arr){ CT.storage.write(KEY_PROGS, arr); }
  function readTools(){ return CT.storage.read(KEY_TOOLS, []); }

  // рендер карточки
  function renderHeader(){
    if(!cur){
      elTitle.textContent = 'Programm wählen…';
      elMeta.textContent  = 'Nr — • Seite —';
      elImg.style.display='none'; elNo.style.display='grid';
      return;
    }
    elTitle.textContent = `${cur.title||'Unbenannt'} — ${cur.nr||'—'}`;
    elMeta.textContent  = progMeta(cur);
    if(cur.img){
      elImg.src = cur.img; elImg.style.display='block'; elNo.style.display='none';
    }else{
      elImg.style.display='none'; elNo.style.display='grid';
    }
  }

  // рендер слотов
  function renderSlots(){
    slotsEl.innerHTML='';
    const maxSlots = cur?.slots?.length || 0;
    if(!cur){ slotsEl.innerHTML = '<div class="muted">Keine Slots. Lege ein Programm an.</div>'; return; }
    cur.slots.forEach((s,idx)=>{
      const card = document.createElement('div');
      card.className='card';
      card.innerHTML = `
        <div class="row between" style="align-items:center">
          <div class="row" style="gap:.6rem; align-items:center">
            <span class="badge">${s.code||('T'+String(idx+1).padStart(2,'0')+String(idx+1).padStart(2,'0'))}</span>
            <div>
              <div style="font-weight:800">${CT.escape(s.title||('Slot #'+(idx+1)))}</div>
              <div class="muted">${s.iso||''}</div>
            </div>
          </div>
          <div class="row" style="gap:.5rem">
            <button class="btn sm" data-i="${idx}" data-act="switch">Wechseln</button>
            <button class="btn sm warn" data-i="${idx}" data-act="remove">Entfernen</button>
          </div>
        </div>`;
      slotsEl.appendChild(card);
    });
    // Пустые слоты?
    if(maxSlots<5){
      for(let i=maxSlots;i<5;i++){
        const empty = document.createElement('div');
        empty.className='card row between';
        empty.innerHTML = `<div><b>#${i+1} • Frei</b><div class="muted">—</div></div>
                           <button class="btn sm" data-i="${i}" data-act="add">Hinzufügen</button>`;
        slotsEl.appendChild(empty);
      }
    }
  }

  // выбор инструмента
  function pickTool(callback){
    const tools = readTools();
    if(!tools.length){ CT.toast('Keine Werkzeuge','warn'); return; }
    let html = `<div class="stack">`;
    tools.forEach((t,i)=>{
      html += `<label class="row" style="gap:.5rem; align-items:center">
                 <input type="radio" name="t" value="${i}">
                 <span class="badge">${CT.escape(t.code||'T')}</span> <b>${CT.escape(t.title||'Werkzeug')}</b>
               </label>`;
    });
    html += `</div>`;
    CT.openModal({title:'Werkzeug wählen', html, okText:'Übernehmen', onOk:()=>{
      const idx = +document.querySelector('input[name="t"]:checked')?.value;
      if(isNaN(idx)) return;
      callback(tools[idx]);
    }});
  }

  // обработчики слотов
  slotsEl.addEventListener('click', e=>{
    const b = e.target.closest('button[data-act]');
    if(!b||!cur) return;
    const i = +b.dataset.i;
    const act = b.dataset.act;
    if(act==='switch'){
      pickTool(tool=>{
        cur.slots[i] = { title:tool.title, iso:tool.iso||'', code:tool.code };
        const arr = readProgs(); const k = arr.findIndex(p=>p.id===cur.id); if(k>-1){arr[k]=cur; writeProgs(arr);}
        renderSlots();
      });
    }else if(act==='remove'){
      cur.slots[i] = { title:`#${i+1} • Frei`, iso:'', code:'' };
      const arr = readProgs(); const k = arr.findIndex(p=>p.id===cur.id); if(k>-1){arr[k]=cur; writeProgs(arr);}
      renderSlots();
    }else if(act==='add'){
      pickTool(tool=>{
        if(!cur.slots[i]) cur.slots[i]={};
        cur.slots[i] = { title:tool.title, iso:tool.iso||'', code:tool.code };
        const arr = readProgs(); const k = arr.findIndex(p=>p.id===cur.id); if(k>-1){arr[k]=cur; writeProgs(arr);}
        renderSlots();
      });
    }
  });

  // кнопки карточки
  document.getElementById('btnRO').onclick=()=>{ side='RO'; renderHeader(); };
  document.getElementById('btnRU').onclick=()=>{ side='RU'; renderHeader(); };
  document.getElementById('btnApply').onclick=()=> CT.toast('Live angewendet','ok');

  // редактирование программы (включая загрузку Zeichnung)
  document.getElementById('btnEditProg').onclick=()=>{
    if(!cur){ CT.toast('Kein Programm','warn'); return; }
    CT.openModal({
      title:'Programm bearbeiten',
      html:`<label class="fld">Titel<input id="e_t" value="${CT.escape(cur.title||'')}" /></label>
            <label class="fld">Nummer<input id="e_n" value="${CT.escape(cur.nr||'')}" /></label>
            <label class="fld">Zeichnung/Foto<input id="e_img" type="file" accept="image/*"></label>`,
      okText:'Speichern',
      onOk:()=>{
        const arr = readProgs(); const k = arr.findIndex(p=>p.id===cur.id);
        if(k>-1){
          arr[k].title = document.getElementById('e_t').value||arr[k].title;
          arr[k].nr    = document.getElementById('e_n').value||arr[k].nr;
          const f = document.getElementById('e_img').files?.[0];
          if(f){
            const reader = new FileReader();
            reader.onload = ()=>{ arr[k].img = String(reader.result); writeProgs(arr); cur=arr[k]; renderHeader(); };
            reader.readAsDataURL(f);
            return; // сохранить после onload
          }
          writeProgs(arr); cur=arr[k]; renderHeader();
        }
      }
    });
  };

  // создать новое
  document.getElementById('btnNewProg').onclick=()=>{
    CT.openModal({
      title:'Neues Programm',
      html:`<label class="fld">Titel<input id="n_t" placeholder="Name"></label>
            <label class="fld">Nummer<input id="n_nr" placeholder="1001234" inputmode="numeric"></label>`,
      okText:'Anlegen',
      onOk:()=>{
        const arr = readProgs();
        const p = { id:CT.uid(), title:(document.getElementById('n_t').value||'Programm'),
                    nr:(document.getElementById('n_nr').value||''), img:'', slots:[
                      {title:'CNMG120408-PM', iso:'ISO-P', code:'T0101'},
                      {title:'#2 • Frei', iso:'', code:''},
                      {title:'#3 • Frei', iso:'', code:''},
                      {title:'#4 • Frei', iso:'', code:''},
                      {title:'#5 • Frei', iso:'', code:''}
                    ]};
        arr.unshift(p); writeProgs(arr); cur=p; renderHeader(); renderSlots(); CT.toast('Angelegt','ok');
      }
    });
  };

  // инициализация
  renderHeader(); renderSlots();

  // Поиск — фильтрует по названию слотов
  CT.bindGlobalSearch(q=>{
    q=q.trim().toLowerCase();
    document.querySelectorAll('#slots .card').forEach(c=>{
      c.style.display = !q || c.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
});
</script>
</body>
</html>
