
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CitiTool — Food-style UI</title>
<style>
:root{
  --bg:#f7f8fc;
  --ink:#0e1a2b;
  --muted:#6b7a90;
  --brand:#2d6cdf;
  --ok:#1e9c57;
  --hair:#e9edf5;
  --card:#fff;
  --radius:22px;
  --r-sm:14px;
  --shadow:0 20px 40px rgba(30,60,120,.10);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px Inter,-apple-system,Segoe UI,Roboto,system-ui,sans-serif}

/* Top gradient header */
.header{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg,#ffffff,#f5f8ff 55%, transparent);
  padding:16px 16px 8px env(safe-area-inset-left);
  border-bottom:1px solid var(--hair);
  backdrop-filter:blur(6px);
}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.badge{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(160deg,#eef3ff,#dfe9ff 60%,#cfe0ff); border:1px solid #d7e3ff;
  font-weight:900;color:#174cab; text-shadow:0 1px 0 #fff}
.h-title{font:900 20px/1.1 Inter}
.h-sub{color:var(--muted);font-size:12px}
.btn{
  height:40px;border-radius:14px;border:1px solid #d8e4ff;background:#fff;padding:0 14px;font-weight:800;color:#174cab
}
.btn.brand{background:linear-gradient(180deg,#2d6cdf,#1f58c7);color:#fff;border-color:#2d6cdf}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;background:#fff;border-radius:12px;border:1px solid #e3eaf7;color:#445b86}
.icon-btn:active{transform:translateY(1px)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}

/* Big search bar */
.search{
  display:flex;align-items:center;gap:10px;margin:12px auto 8px;
  background:#fff;border:1px solid #e3eaf7;border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);
  max-width:980px
}
.search input{border:0;outline:0;font:600 16px Inter;width:100%;background:transparent}

/* Chips (filters) */
.chips{display:flex;gap:8px;overflow:auto;padding:6px 2px 2px}
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:20px;background:#fff;border:1px solid #e3eaf7;font-weight:700;color:#253b6a;white-space:nowrap
}
.chip.active{background:#2d6cdf;color:#fff;border-color:#2d6cdf}

/* Content sections */
.container{padding:10px 14px calc(96px + env(safe-area-inset-bottom))}
.section{max-width:980px;margin:0 auto 16px}
.section h2{margin:8px 2px 10px;font:900 22px/1.1 Inter}

/* Card Grid (Food-like) */
.grid{display:grid;gap:14px}
.card{
  display:grid;grid-template-columns:112px 1fr auto;gap:12px;
  background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)
}
.thumb{
  width:112px;height:112px;border-radius:16px;object-fit:cover;background:#f0f3fa;border:1px solid #e7ecf6
}
.meta .name{font:900 18px/1.2 Inter;margin:.2rem 0}
.meta .sub{color:var(--muted);font-weight:600}
.badge{user-select:none}
.pill{
  display:inline-grid;place-items:center;height:28px;padding:0 10px;border-radius:10px;background:#eef3ff;color:#174cab;font-weight:800;border:1px solid #d8e4ff
}
.actions{display:grid;gap:8px;align-content:center}
.btn.sm{height:36px;padding:0 10px;border-radius:12px}

/* Floating tabbar (bottom) */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:10px env(safe-area-inset-right) calc(10px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
  background:linear-gradient(180deg,#ffffffee,#ffffffcc); border-top:1px solid var(--hair); backdrop-filter:blur(10px)
}
.dock .wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.dock a{
  text-decoration:none;color:#1f2d4a;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px;border-radius:14px
}
.dock a.active{background:#fff;border:1px solid #e3eaf7;box-shadow:0 12px 28px rgba(30,60,120,.08)}
.dock small{font-weight:800}

.hide{display:none}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="h-row">
    <a class="logo" href="#">
      <span class="badge">CT</span>
      <div>
        <div class="h-title">CitiTool</div>
        <div class="h-sub">Setup • Tools • Programme</div>
      </div>
    </a>
    <div class="h-row">
      <button class="btn brand" id="newProg">Neues Programm</button>
      <button class="icon-btn" id="searchBtn" aria-label="Suchen">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.3 14.3l4.7 4.7 1.4-1.4-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
      </button>
    </div>
  </div>

  <div class="search" id="searchBar">
    <svg width="20" height="20" viewBox="0 0 24 24" style="fill:#9bb0d8"><path d="M10 2a8 8 0 105.3 14.3l4.7 4.7 1.4-1.4-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
    <input id="q" placeholder="Suchen: Werkzeuge, Programme, Notizen…">
  </div>

  <div class="chips" id="chipRow">
    <button class="chip active" data-filter="all">Alle</button>
    <button class="chip" data-filter="setup">Setup</button>
    <button class="chip" data-filter="tools">Tools</button>
    <button class="chip" data-filter="programs">Programme</button>
    <button class="chip" data-filter="docs">Docs</button>
  </div>
</header>

<!-- Content -->
<main class="container">
  <!-- Tools -->
  <section class="section" data-block="tools">
    <h2>Werkzeuge</h2>
    <div class="grid" id="toolsGrid">
      <!-- cards injected by JS -->
    </div>
  </section>

  <!-- Programme -->
  <section class="section" data-block="programs">
    <h2>Programme</h2>
    <div class="grid" id="progGrid"></div>
  </section>

  <!-- Docs -->
  <section class="section" data-block="docs">
    <h2>Dokumente</h2>
    <div class="grid" id="docsGrid"></div>
  </section>
</main>

<!-- Dock -->
<nav class="dock">
  <div class="wrap">
    <a class="active" href="#"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg><small>Dash</small></a>
    <a href="./setup.html"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7 7 0 10-7.08 7.06 7 7 0 007.08-7.06zM11 6h2v6h-2V6zm0 8h2v2h-2v-2z"/></svg><small>Setup</small></a>
    <a href="./tools.html"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M22 19l-8-8 2-2 8 8-2 2zM14.3 7.7l-1-1L9 11v2h2l4.3-4.3zM7 2l3 3-2 2-3-3L7 2zM2 7l3 3-2 2-3-3L2 7zM3 14h6v8H3z"/></svg><small>Tools</small></a>
    <a href="./setup.html"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h18v2H3V4zm0 4h12v2H3V8zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg><small>Programme</small></a>
    <a href="./docs.html"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5"/><path fill="currentColor" d="M8 13h8v2H8zM8 17h8v2H8z"/></svg><small>Docs</small></a>
  </div>
</nav>

<script>
/* Demo data (замени на реальное чтение из localStorage при желании) */
const demoTools = [
  {name:'CNMG120408-PM 4325', code:'CNMG120408-PM', cat:'Platten', img:'https://picsum.photos/seed/ct1/300/300'},
  {name:'VDI30 Halter Rechts', code:'VDI30-R', cat:'Halter', img:'https://picsum.photos/seed/ct2/300/300'},
  {name:'Bohrer Ø10', code:'DR-10', cat:'Bohrer', img:'https://picsum.photos/seed/ct3/300/300'}
];
const demoProgs = [
  {title:'Grundsetup', number:'1001', side:'RO (G54)', img:'https://picsum.photos/seed/prog1/400/300'},
  {title:'Serie A', number:'1002', side:'RU (G55)', img:'https://picsum.photos/seed/prog2/400/300'}
];
const demoDocs = [
  {title:'Aufspann-Check', sub:'Schrauben, Anschläge…', img:'https://picsum.photos/seed/doc1/300/300'},
  {title:'Werkstoff Notiz', sub:'ISO-P, Kühlung…', img:'https://picsum.photos/seed/doc2/300/300'},
];

/* Render helpers */
function el(html){const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild;}

function toolCard(t){
  return el(`
    <article class="card" data-kind="tools">
      <img class="thumb" src="${t.img}" alt="">
      <div class="meta">
        <div class="name">${t.name}</div>
        <div class="sub">${t.code} • ${t.cat}</div>
      </div>
      <div class="actions">
        <span class="pill">Info</span>
        <button class="btn sm">Zu Setup</button>
      </div>
    </article>`);
}
function progCard(p){
  return el(`
    <article class="card" data-kind="programs">
      <img class="thumb" src="${p.img}" alt="">
      <div class="meta">
        <div class="name">#${p.number} — ${p.title}</div>
        <div class="sub">Seite ${p.side}</div>
      </div>
      <div class="actions">
        <span class="pill">Live</span>
        <button class="btn sm">Öffnen</button>
      </div>
    </article>`);
}
function docCard(d){
  return el(`
    <article class="card" data-kind="docs">
      <img class="thumb" src="${d.img}" alt="">
      <div class="meta">
        <div class="name">${d.title}</div>
        <div class="sub">${d.sub}</div>
      </div>
      <div class="actions">
        <button class="btn sm">Lesen</button>
      </div>
    </article>`);
}

/* Mount demo */
const toolsGrid=document.getElementById('toolsGrid');
demoTools.forEach(t=>toolsGrid.appendChild(toolCard(t)));
const progGrid=document.getElementById('progGrid');
demoProgs.forEach(p=>progGrid.appendChild(progCard(p)));
const docsGrid=document.getElementById('docsGrid');
demoDocs.forEach(d=>docsGrid.appendChild(docCard(d)));

/* Search + Chips filter (очень лёгкий фильтр по тексту/типу) */
const q=document.getElementById('q');
q.addEventListener('input', ()=>{
  const val=q.value.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = c.textContent.toLowerCase().includes(val) ? '' : 'none';
  });
});
document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    ch.classList.add('active');
    const f=ch.dataset.filter;
    document.querySelectorAll('.section').forEach(s=>{
      if(f==='all'){ s.classList.remove('hide'); }
      else{ s.classList.toggle('hide', s.getAttribute('data-block')!==f); }
    });
    window.scrollTo({top:document.querySelector('.section:not(.hide)').offsetTop-20, behavior:'smooth'});
  });
});

/* Toggle search bar */
const searchBtn=document.getElementById('searchBtn'), searchBar=document.getElementById('searchBar');
searchBtn.onclick=()=>{ searchBar.style.display = (searchBar.style.display==='none'?'':'none') ? 'none' : ''; q.focus(); };
</script>
</body>
</html>
