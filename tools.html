<!doctype html><html lang="de"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Tools • CitiTool</title>
<link rel="stylesheet" href="ui/core.css">
</head><body>
<div id="appbar"></div>
<main class="container">
  <section class="section">
    <h2>Werkzeuge</h2>
    <div class="list" id="list"></div>
  </section>
</main>
<div id="dock"></div>
<script src="ui/core.js"></script>
<script>
CT.ui.mountAppBar('#appbar',{
  title:'CITI·TOOL', subtitle:'Werkzeuge',
  actions:[{label:'Neues Werkzeug',type:'brand',onClick:()=>CT.ui.toolEditor({})}],
  onSearch:(q)=>render(q)
});
CT.ui.mountDock('#dock',{active:'tools'});

function row(t){
  return `<div class="row">
    <div>
      <div class="title">${t.name}</div>
      <div class="meta">${t.iso||'-'} • ${t.code||''} ${t.cats?.length?('• '+t.cats.join(', ')) : ''}</div>
    </div>
    <div>
      <button class="ct-btn" data-ed="${t.id}">Bearbeiten</button>
      <button class="ct-btn warn" data-del="${t.id}">Löschen</button>
    </div>
  </div>`;
}
function render(q=''){
  const list=document.getElementById('list');
  const arr=CT.tool.search(q);
  list.innerHTML = arr.map(row).join('') || '<div class="muted">Keine Werkzeuge…</div>';
  list.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>CT.ui.toolEditor({toolId:b.dataset.ed}));
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{CT.tool.remove(b.dataset.del);});
}
render();
CT.bus.on('tools:changed',()=>render(document.getElementById('ctSearchInput')?.value||''));
</script>
</body></html>
