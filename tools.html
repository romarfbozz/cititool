<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CitiTool • Tools</title>
<link rel="stylesheet" href="./ui/neo.css">
</head>
<body>

<!-- фон -->
<div class="hero-bg"><div class="hero-grid"></div></div>

<!-- AppBar -->
<header class="appbar">
  <div class="wrap">
    <div class="logo-line">
      <div class="ct-badge">CT</div>
      <div class="ct-word"><b>CITI‧TOOL</b></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnNew">Neues Werkzeug</button>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.29l4.7 4.7 1.41-1.41-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/></svg>
        <input type="search" placeholder="Suchen…" id="q" autocomplete="off">
      </div>
    </div>
  </div>
</header>

<main class="main">

  <!-- Letztes Werkzeug + Категории -->
  <section class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px">
      <h2 style="margin:0">Letztes Werkzeug</h2>
      <button class="btn btn--outline is-sm" id="btnCats">Kategorien…</button>
    </div>
    <div class="list" id="latestWrap"></div>
  </section>

  <!-- Список инструментов -->
  <section class="section">
    <h2>Werkzeuge</h2>
    <div class="list" id="toolList"></div>
  </section>

</main>

<!-- Dock -->
<nav class="dock">
  <div class="wrap">
    <a href="./index.html" data-id="dash"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg><small>Dash</small></a>
    <a href="./setup.html" data-id="setup"><svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 10-7.08 7.06 7 7 0 007.08-7.06zM11 6h2v6h-2V6zm0 8h2v2h-2v-2z"/></svg><small>Setup</small></a>
    <a href="./tools.html" class="active" data-id="tools"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19l-8-8 2-2 8 8-2 2zM14.3 7.7l-1-1L9 11v2h2l4.3-4.3zM7 2l3 3-2 2-3-3L7 2zM2 7l3 3-2 2-3-3L2 7zM3 14h6v8H3z"/></svg><small>Tools</small></a>
    <a href="./setup.html" data-id="programs"><svg class="icon" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 4h12v2H3V8zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg><small>Programme</small></a>
    <a href="./docs.html" data-id="docs"><svg class="icon" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5"/><path d="M8 13h8v2H8zM8 17h8v2H8z"/></svg><small>Docs</small></a>
  </div>
</nav>

<script src="./ui/neo.js"></script>
<script src="./ui/tools.js"></script>
<script>
CT.neo.wireSearch(document.getElementById('searchBox'), document.getElementById('q'));
CT.neo.shrinkOnScroll();
CT.neo.setActiveDock('tools');

Tools.ensureSeeds();

/* ---- state ---- */
const state={ q:'' };
CT.on('search', q=>{ state.q=q||''; renderList(); });

/* ---- refs ---- */
const listEl = document.getElementById('toolList');
const latestWrap = document.getElementById('latestWrap');

/* ---- viewer ---- */
function openViewer(t){
  const box=document.createElement('div');

  // top image / placeholder
  const top=document.createElement('div');
  if (t.photo){
    const img=document.createElement('img'); img.src=t.photo; img.alt='Foto'; img.style.width='100%'; img.style.borderRadius='12px';
    top.append(img);
  }else{
    const ph=document.createElement('div');
    ph.style.height='160px'; ph.style.border='1px solid #edf1f7'; ph.style.borderRadius='12px';
    ph.style.display='grid'; ph.style.placeItems='center'; ph.style.color='#6b7a90'; ph.style.fontWeight='800';
    ph.textContent='kein Foto'; top.append(ph);
  }

  const h=document.createElement('h3'); h.textContent=t.name; h.style.margin='12px 0 6px';
  const meta=document.createElement('div'); meta.className='meta';
  meta.textContent=`${t.category} • ${new Date(Number(t.updatedAt||t.createdAt)).toLocaleString()}`;

  const body=document.createElement('div');
  if (t.iso || t.code){
    const p1=document.createElement('div'); p1.className='meta';
    p1.textContent=[t.iso,t.code].filter(Boolean).join(' • ');
    body.append(p1);
  }
  if (t.notes){
    const p2=document.createElement('p'); p2.textContent=t.notes;
    body.append(p2);
  }

  const tagsWrap=document.createElement('div');
  tagsWrap.style.display='flex'; tagsWrap.style.flexWrap='wrap'; tagsWrap.style.gap='6px'; tagsWrap.style.marginTop='8px';
  (t.tags||[]).forEach(tag=>{
    const s=document.createElement('span'); s.className='tag tag--sm'; s.textContent=tag; tagsWrap.append(s);
  });

  box.append(top,h,meta,body,tagsWrap);

  CT.ui.modal.open({
    title:'Werkzeug',
    contentEl:box,
    footer:[
      {label:'Löschen', kind:'danger', onClick:()=>{
        CT.ui.confirm({title:'Löschen?', msg:`«${t.name}» wirklich entfernen?`}).then(ok=>{
          if(ok){ Tools.remove(t.id); CT.ui.modal.close(); render(); }
        });
      }},
      {label:'Bearbeiten', onClick:()=>{ CT.ui.modal.close(); openEditor(t); }},
      {label:'Schließen', onClick:()=>CT.ui.modal.close()}
    ],
    wide:true
  });
}

/* ---- editor (с удалением фото) ---- */
function openEditor(tool){
  const cats = Tools.loadCats();
  if (tool && tool.category && !cats.includes(tool.category)) cats.push(tool.category);

  const initial = tool
    ? { name:tool.name, category:tool.category||cats[0]||'Allgemein', iso:tool.iso||'', code:tool.code||'', tags:(tool.tags||[]).join(', '), notes:tool.notes||'' }
    : { name:'', category:cats[0]||'Allgemein', iso:'', code:'', tags:'', notes:'' };

  let removePhoto=false;

  const form = CT.ui.form.create({
    values: initial,
    fields: [
      {type:'text', key:'name', label:'Name', placeholder:'CNMG120408'},
      {type:'select', key:'category', label:'Kategorie', options: cats},
      {type:'text', key:'iso', label:'ISO'},
      {type:'text', key:'code', label:'Code'},
      {type:'text', key:'tags', label:'Tags (comma)'},
      {type:'textarea', key:'notes', label:'Notizen', rows:4},
      {type:'file', key:'file', label:'Foto/Datei', accept:'.png,.jpg,.jpeg,.webp'}
    ]
  });

  // preview + remove
  const preview=document.createElement('div');
  preview.style.display='flex'; preview.style.alignItems='center'; preview.style.gap='10px'; preview.style.margin='0 0 10px';
  if (tool && tool.photo){
    const img=document.createElement('img'); img.src=tool.photo; img.width=64; img.height=64; img.style.borderRadius='10px';
    const del=document.createElement('button'); del.className='btn btn--outline is-sm'; del.textContent='Foto entfernen';
    del.onclick=()=>{ removePhoto=true; preview.innerHTML='<div class="meta">Foto wird entfernt</div>'; };
    preview.append(img, del);
  }
  const fileInput = form.el.querySelector('input[type=file]');
  fileInput.addEventListener('change', ()=>{ removePhoto=false; });

  // + neue Kategorie
  const toolsBar=document.createElement('div');
  toolsBar.style.display='flex'; toolsBar.style.justifyContent='space-between'; toolsBar.style.margin='0 0 8px';
  const btnNewCat=document.createElement('button'); btnNewCat.className='btn btn--outline is-sm'; btnNewCat.textContent='+ Neue Kategorie';
  btnNewCat.onclick=()=>{
    const cf=CT.ui.form.create({values:{name:''},fields:[{type:'text',key:'name',label:'Name'}]});
    CT.ui.modal.open({
      title:'Kategorie hinzufügen',
      contentEl:cf.el,
      footer:[
        {label:'Abbrechen',onClick:()=>CT.ui.modal.close()},
        {label:'Hinzufügen',kind:'primary',onClick:()=>{
          const v=cf.getValues(); const name=(v.name||'').trim(); if(!name){cf.setErrors({name:'Pflichtfeld'});return;}
          Tools.cats.add(name); CT.ui.modal.close(); CT.ui.modal.close(); openEditor(tool);
        }}
      ]
    });
  };
  toolsBar.append(document.createTextNode(''), btnNewCat);

  const holder=document.createElement('div');
  if (preview.childNodes.length) holder.append(preview);
  holder.append(toolsBar, form.el);

  CT.ui.modal.open({
    title: tool ? 'Werkzeug bearbeiten' : 'Neues Werkzeug',
    contentEl: holder,
    footer:[
      {label:'Abbrechen', onClick:()=>CT.ui.modal.close()},
      {label:'Speichern', kind:'primary', onClick: async ()=>{
        const v=form.getValues();
        if (!v.name || !v.name.trim()){ form.setErrors({name:'Pflichtfeld'}); return; }
        const patch={
          name: v.name.trim(),
          category: (v.category||'Allgemein').trim(),
          iso: v.iso||'',
          code: v.code||'',
          tags: v.tags ? v.tags.split(',').map(s=>s.trim()).filter(Boolean) : [],
          notes: v.notes||'',
        };
        const f=fileInput.files && fileInput.files[0];
        if (f){
          const imgData = /^image\//.test(f.type) ? await Tools.resizeImageToDataURL(f,512) : null;
          patch.photo = imgData;
        } else if (removePhoto){
          patch.photo = null;
        }
        if (tool){ Tools.update(tool.id, patch); } else { Tools.create(patch); }
        CT.ui.modal.close(); render();
      }}
    ],
    wide:true
  });
}

/* ---- categories manager ---- */
document.getElementById('btnCats').onclick=()=>{
  const cats = Tools.loadCats();
  const box=document.createElement('div'); const list=document.createElement('div');

  function refresh(){
    list.innerHTML=''; cats.splice(0,cats.length,...Tools.loadCats());
    cats.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const left=document.createElement('div'); left.innerHTML=`<div class="title">${c}</div>`;
      const right=document.createElement('div'); right.style.display='flex'; right.style.gap='6px';
      const bRen=document.createElement('button'); bRen.className='btn btn--outline is-sm'; bRen.textContent='Umbenennen';
      const bDel=document.createElement('button'); bDel.className='btn btn--outline is-sm'; bDel.textContent='Löschen';
      bRen.onclick=()=>{
        const f=CT.ui.form.create({values:{to:c},fields:[{type:'text',key:'to',label:'Neuer Name',placeholder:c}]});
        CT.ui.modal.open({
          title:`Kategorie «${c}» umbenennen`,
          contentEl:f.el,
          footer:[
            {label:'Abbrechen',onClick:()=>CT.ui.modal.close()},
            {label:'Speichern',kind:'primary',onClick:()=>{
              const v=f.getValues(); const to=(v.to||'').trim(); if(!to){f.setErrors({to:'Pflichtfeld'});return;}
              Tools.cats.rename(c,to); CT.ui.modal.close(); document.getElementById('btnCats').click();
            }}
          ]
        });
      };
      bDel.onclick=()=>{
        const f=CT.ui.form.create({values:{reassign:'Allgemein'},fields:[{type:'select',key:'reassign',label:'Werkzeuge zu',options:Tools.loadCats()}]});
        CT.ui.modal.open({
          title:`Kategorie «${c}» löschen`,
          contentEl:f.el,
          footer:[
            {label:'Abbrechen',onClick:()=>CT.ui.modal.close()},
            {label:'Löschen',kind:'danger',onClick:()=>{
              const v=f.getValues(); Tools.cats.remove(c, v.reassign||'Allgemein'); CT.ui.modal.close(); document.getElementById('btnCats').click();
            }}
          ]
        });
      };
      right.append(bRen,bDel); row.append(left,right); list.append(row);
    });
  }

  const add=document.createElement('div'); add.className='row';
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='+ Hinzufügen';
  btn.onclick=()=>{
    const f=CT.ui.form.create({values:{name:''},fields:[{type:'text',key:'name',label:'Name'}]});
    CT.ui.modal.open({
      title:'Neue Kategorie',
      contentEl:f.el,
      footer:[
        {label:'Abbrechen',onClick:()=>CT.ui.modal.close()},
        {label:'Hinzufügen',kind:'primary',onClick:()=>{
          const v=f.getValues(); const name=(v.name||'').trim(); if(!name){f.setErrors({name:'Pflichtfeld'});return;}
          Tools.cats.add(name); CT.ui.modal.close(); refresh();
        }}
      ]
    });
  };
  add.append(document.createElement('div'), btn);

  box.append(add, list);
  refresh();

  CT.ui.modal.open({
    title:'Kategorien',
    contentEl:box,
    footer:[{label:'Schließen',onClick:()=>CT.ui.modal.close()}],
    wide:true
  });
};

/* ---- latest ---- */
function renderLatest(){
  latestWrap.innerHTML='';
  const all = Tools.list({});
  if (all.length===0){
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div'); left.innerHTML='<div class="title">Noch nichts hinzugefügt</div><div class="meta">Lege dein erstes Werkzeug an</div>';
    const right=document.createElement('div'); const btn=document.createElement('button'); btn.className='btn btn--outline is-sm'; btn.textContent='Neues Werkzeug'; btn.onclick=()=>openEditor();
    right.append(btn); row.append(left,right); latestWrap.append(row); return;
  }
  const t=all[0];
  const row=document.createElement('div'); row.className='row';
  const left=document.createElement('div');
  const grid=document.createElement('div'); grid.style.display='grid'; grid.style.gridTemplateColumns='56px auto'; grid.style.gap='10px';

  const ph=document.createElement('div');
  ph.style.width='56px'; ph.style.height='56px'; ph.style.border='1px solid #edf1f7'; ph.style.borderRadius='10px';
  ph.style.display='grid'; ph.style.placeItems='center'; ph.style.color='#6b7a90'; ph.style.fontWeight='800';
  if (t.photo){ const img=document.createElement('img'); img.src=t.photo; img.width=56; img.height=56; img.style.borderRadius='10px'; ph.innerHTML=''; ph.append(img); } else { ph.textContent='CT'; }

  const tw=document.createElement('div');
  const title=document.createElement('div'); title.className='title'; title.textContent=t.name;
  const meta=document.createElement('div'); meta.className='meta'; meta.textContent=`${t.category} • ${[t.iso,t.code].filter(Boolean).join(' • ')}`;
  const txt=document.createElement('div'); txt.className='meta'; txt.textContent=(t.notes||'').slice(0,120);
  tw.append(title,meta,txt);

  grid.append(ph,tw); left.append(grid);

  const right=document.createElement('div'); right.style.display='flex'; right.style.gap='6px';
  const bInfo=document.createElement('button'); bInfo.className='btn btn--outline is-sm'; bInfo.textContent='i';
  bInfo.onclick=()=>openViewer(t);
  right.append(bInfo);

  row.append(left,right); latestWrap.append(row);
}

/* ---- list ---- */
function renderList(){
  listEl.innerHTML='';
  const arr=Tools.list({q:state.q});
  if (arr.length===0){
    const empty=document.createElement('div'); empty.className='row';
    empty.innerHTML='<div class="muted">Keine Werkzeuge</div>'; listEl.append(empty); return;
  }
  arr.forEach(t=>{
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div');
    const grid=document.createElement('div'); grid.style.display='grid'; grid.style.gridTemplateColumns='56px auto'; grid.style.gap='10px';

    const ph=document.createElement('div');
    ph.style.width='56px'; ph.style.height='56px'; ph.style.border='1px solid #edf1f7'; ph.style.borderRadius='10px';
    ph.style.display='grid'; ph.style.placeItems='center'; ph.style.color='#6b7a90'; ph.style.fontWeight='800';
    if (t.photo){ const img=document.createElement('img'); img.src=t.photo; img.width=56; img.height=56; img.style.borderRadius='10px'; ph.innerHTML=''; ph.append(img); } else { ph.textContent='CT'; }

    const tw=document.createElement('div');
    const title=document.createElement('div'); title.className='title'; title.textContent=t.name;
    const meta=document.createElement('div'); meta.className='meta'; meta.textContent=`${t.category} • ${[t.iso,t.code].filter(Boolean).join(' • ')}`;
    const txt=document.createElement('div'); txt.className='meta'; txt.textContent=(t.notes||'').slice(0,120);
    tw.append(title,meta,txt);

    grid.append(ph,tw); left.append(grid);

    const right=document.createElement('div'); right.style.display='flex'; right.style.gap='6px';
    const bInfo=document.createElement('button'); bInfo.className='btn btn--outline is-sm'; bInfo.textContent='i';
    bInfo.onclick=()=>openViewer(t);
    right.append(bInfo);

    row.append(left,right); listEl.append(row);
  });
}

/* ---- new tool btn ---- */
document.getElementById('btnNew').onclick=()=>openEditor();

/* ---- init ---- */
function render(){ renderLatest(); renderList(); }
render();
</script>
</body>
</html>
